# Web tier (frontends/web: landing site, blog, riso art).
#
# Included by the root Taskfile.yml with `flatten: true`: task names stay literal
# (`web:check`). Shared vars (UI, WEB, PY, ...) and env live in the root file.

version: '3'

tasks:
  # ── web (frontends/web — Piloti landing site + blog) ────────────────────────

  web:install:
    desc: Install web (landing site) dependencies
    dir: '{{.WEB}}'
    cmds:
      # Bun installs (ADR-0103); Node still runs Astro, as the scripts' shebangs say.
      - bun install --frozen-lockfile

  web:check:
    desc: Astro typecheck + content validation for the web service
    dir: '{{.WEB}}'
    cmds:
      - bun run check

  web:build:
    desc: Production build of the web service
    dir: '{{.WEB}}'
    cmds:
      - bun run build

  web:verify:
    desc: Everything CI runs for the web tier
    cmds:
      - task: web:install
      - task: web:check
      - task: web:build

  web:preview:
    desc: Build the web service with drafts rendered (blog preview only — never ship this)
    dir: '{{.WEB}}'
    env:
      # Preview-only. `astro build` bakes the result into the image, so a release
      # build with this set would publish every unfinished draft to the live site.
      PUBLIC_INCLUDE_DRAFTS: '1'
      PUBLIC_SITE_URL: '{{.PREVIEW_SITE_URL | default "http://localhost:4321"}}'
    cmds:
      - bun install --frozen-lockfile
      - bun run build

  # ── riso art (frontends/web/art/riso — procedural prints for the site) ──────
  # The raw commands are `node art/riso/<script>.mjs` in frontends/web; every
  # task below is one of them. The workflow and the series rules are in
  # frontends/web/art/riso/README.md.

  art:setup:
    desc: Clone the pinned riso-windowseat kit into the user cache and find a browser (idempotent)
    dir: '{{.WEB}}'
    cmds:
      - node art/riso/setup.mjs {{.CLI_ARGS}}

  art:new:
    desc: 'Scaffold a riso work from the template: task art:new -- <work> [--title "Title"]'
    dir: '{{.WEB}}'
    cmds:
      - node art/riso/new.mjs {{.CLI_ARGS}}

  art:export:
    desc: 'Export riso works to public/art/ and art/riso/out/, then rewrite src/data/art.json: task art:export -- [--work w] [--only ids]'
    dir: '{{.WEB}}'
    cmds:
      - node art/riso/export.mjs {{.CLI_ARGS}}

  art:verify:
    desc: The kit's determinism check on every riso job, in both engines (minutes; not in web:check)
    dir: '{{.WEB}}'
    cmds:
      - node art/riso/verify.mjs {{.CLI_ARGS}}

  art:check:
    desc: The fast riso gate (manifest, files, sizes, alt text, ids in src/); also part of web:check
    dir: '{{.WEB}}'
    cmds:
      - node art/riso/check.mjs
