# Site tier (apps/site: landing site, blog, riso art).
#
# Included by the root Taskfile.yml with `flatten: true`: task names stay literal
# (`site:check`). Shared vars (UI, SITE, PY, ...) and env live in the root file.

version: '3'

tasks:
  # ── site (apps/site — Piloti landing site + blog) ───────────────────────

  site:install:
    desc: Install the site (landing site) dependencies
    dir: '{{.SITE}}'
    cmds:
      # Bun installs (ADR-0103); Node still runs Astro, as the scripts' shebangs say.
      - bun install --frozen-lockfile

  site:check:
    desc: Astro typecheck + content validation for the site
    dir: '{{.SITE}}'
    cmds:
      - bun run check

  site:build:
    desc: Production build of the site
    dir: '{{.SITE}}'
    cmds:
      - bun run build

  site:verify:
    desc: Everything CI runs for the site tier
    cmds:
      - task: site:install
      - task: site:check
      - task: site:build

  site:preview:
    desc: Build the site with drafts rendered (blog preview only — never ship this)
    dir: '{{.SITE}}'
    env:
      # Preview-only. `astro build` bakes the result into the image, so a release
      # build with this set would publish every unfinished draft to the live site.
      PUBLIC_INCLUDE_DRAFTS: '1'
      PUBLIC_SITE_URL: '{{.PREVIEW_SITE_URL | default "http://localhost:4321"}}'
    cmds:
      - bun install --frozen-lockfile
      - bun run build

  # ── website (apps/website — greenfield Astro site on the design system) ──
  # Replaces the site tier at cutover (corporate design plan, slice 5). Until
  # then both run side by side.

  website:install:
    desc: Install the website dependencies
    dir: '{{.WEBSITE}}'
    cmds:
      - bun install --frozen-lockfile

  website:check:
    desc: Astro typecheck, the brand copies and the brand rules (scripts/check_brand_rules.mjs) for the website
    dir: '{{.WEBSITE}}'
    cmds:
      - bun run check

  website:build:
    desc: Production build of the website
    dir: '{{.WEBSITE}}'
    cmds:
      - bun run build

  website:verify:
    desc: Everything CI runs for the website
    cmds:
      - task: website:install
      - task: website:check
      - task: website:test
      - task: website:build
      # The brand rules' own tests, then the rules once more over the fresh build:
      # the AI-tag rule reads the built pages.
      - node --test scripts/check_brand_rules.test.mjs
      - bun scripts/check_brand_rules.mjs --require-build
      - task: website:a11y

  website:test:
    desc: The website's unit tests (runtime specs and src/**/*.test.ts)
    dir: '{{.WEBSITE}}'
    cmds:
      - bun run test

  website:a11y:
    desc: axe-core WCAG 2.2 AA over every built page, DE and EN (needs a build and Playwright's Chromium)
    dir: '{{.WEBSITE}}'
    cmds:
      - bunx playwright install chromium
      - bun run check:a11y

  website:capture:
    desc: Screenshot every website route at four widths (agent-browser; flags after --)
    dir: '{{.WEBSITE}}'
    cmds:
      - bun run capture {{.CLI_ARGS}}

  # ── riso art (apps/site/art/riso — procedural prints for the site) ──────
  # The raw commands are `node art/riso/<script>.mjs` in apps/site; every
  # task below is one of them. The workflow and the series rules are in
  # apps/site/art/riso/README.md.

  art:setup:
    desc: Clone the pinned riso-windowseat kit into the user cache and find a browser (idempotent)
    dir: '{{.SITE}}'
    cmds:
      - node art/riso/setup.mjs {{.CLI_ARGS}}

  art:new:
    desc: 'Scaffold a riso work from the template: task art:new -- <work> [--title "Title"]'
    dir: '{{.SITE}}'
    cmds:
      - node art/riso/new.mjs {{.CLI_ARGS}}

  art:export:
    desc: 'Export riso works to public/art/ and art/riso/out/, then rewrite src/data/art.json: task art:export -- [--work w] [--only ids]'
    dir: '{{.SITE}}'
    cmds:
      - node art/riso/export.mjs {{.CLI_ARGS}}

  art:verify:
    desc: The kit's determinism check on every riso job, in both engines (minutes; not in site:check)
    dir: '{{.SITE}}'
    cmds:
      - node art/riso/verify.mjs {{.CLI_ARGS}}

  art:check:
    desc: The fast riso gate (manifest, files, sizes, alt text, ids in src/); also part of site:check
    dir: '{{.SITE}}'
    cmds:
      - node art/riso/check.mjs
