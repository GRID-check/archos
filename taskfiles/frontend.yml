# Frontend tier (frontends/ui) and the tenant-isolation suite.
#
# Included by the root Taskfile.yml with `flatten: true`: task names stay literal
# (`fe:test`). Shared vars (UI, SITE, PY, ...) and env live in the root file.

version: '3'

tasks:
  # ── frontend (frontends/ui) ─────────────────────────────────────────────────

  fe:install:
    desc: Install UI dependencies
    dir: '{{.UI}}'
    cmds:
      # Bun is the toolchain, never the runtime (ADR-0103). Do not
      # add `--bun`: it exports NODE_OPTIONS=--bun, and Turbopack's PostCSS step
      # spawns a real `node`, which rejects the flag and fails the build.
      - bun install --frozen-lockfile

  fe:build:jobs:
    desc: Bundle the bff-jobs slice entry into dist-jobs/slice.mjs, what `GRID_BFF_JOBS_MODE=inprocess` imports
    dir: '{{.UI}}'
    cmds:
      - bun run build:jobs

  fe:lint:
    desc: 'Lint the UI (oxlint, the repo rules included as a JS plugin) and its module seams (dependency-cruiser). CI: task fe:lint -- --format=github'
    dir: '{{.UI}}'
    cmds:
      # Extra arguments reach oxlint: CI passes `--format=github`, which turns
      # each finding into an annotation on the pull request's diff.
      - bun run lint {{.CLI_ARGS}}
      # The module seams (dependency-cruiser): lib ↛ UI, components ↛ features,
      # no deep or circular feature imports, server-only stays server-side.
      # Known violations pass, new ones and stale baseline entries fail.
      # docs/contributing/module-seams.md
      - bun run lint:seams

  fe:types:
    desc: Typecheck the UI, specs included (next build checks production code only)
    dir: '{{.UI}}'
    cmds:
      # `bun check`: TypeScript 7's checker, built into the pinned Bun (ADR-0103).
      # Extra arguments reach it, so `-- src/lib/foo.ts` checks one file and its
      # imports. No `.tsbuildinfo`: every run checks the whole project, in seconds.
      - bun run type-check {{.CLI_ARGS}}

  fe:blast-radius:
    desc: 'Hold each hub module to the specs it reached when recorded (-- --update rewrites the baseline, -- --top 30 lists the widest)'
    dir: '{{.UI}}'
    cmds:
      # How many specs a one-line change to a module selects, from esbuild's
      # import graph, against scripts/blast-radius.baseline.json. A few seconds.
      - node scripts/blast-radius.mjs {{.CLI_ARGS}}

  fe:test:
    desc: Run the UI test suite
    dir: '{{.UI}}'
    cmds:
      - bun run test

  fe:test:ci:
    desc: UI tests with the coverage reporters CI's coverage comment consumes
    dir: '{{.UI}}'
    cmds:
      - bun run test:ci -- --coverage.reporter=json-summary --coverage.reporter=json

  db:test:rls:
    desc: >-
      Tenant-isolation suite against a throwaway Postgres, connected as the
      restricted runtime role (ADR-0041). Needs PostgreSQL server binaries.
    cmds:
      - bash scripts/rls-test-db.sh

  fe:search:latency:
    desc: >-
      Measure the workspace search's documents SQL over a seeded office (60,000
      documents, three organizations) as the runtime role under RLS. Prints
      p50/p95 per query; a measurement, not a gate. Needs PostgreSQL server binaries.
    cmds:
      - GRID_SEARCH_LATENCY=1 bash scripts/rls-test-db.sh --only src/lib/search/search-latency.integration.spec.ts

  fe:test:shard:
    desc: 'One shard of the UI suite, as a blob report (CI: SHARD=1/8 task fe:test:shard)'
    dir: '{{.UI}}'
    cmds:
      # `--reporter=blob` writes the blob that fe:test:merge stitches into one
      # run and one coverage set. The default reporter is added beside it, since
      # a blob alone prints nothing: a red shard's log then names the failing
      # tests instead of ending at the step's exit code.
      # Coverage must be collected per shard — it cannot be recomputed at merge
      # time, because each shard only ever loaded its own slice of the app.
      #
      # `--outputFile` is EXPLICIT rather than left to the reporter's default,
      # and `test:merge` pins the same directory. Vitest moved that default
      # from `.vitest-reports/` to `.vitest/blob/` in v5, which broke the
      # round-trip silently: the shard wrote one place, ci.yml uploaded another,
      # and `Frontend coverage` failed at the far end with an ENOENT naming a
      # directory nothing in this repo mentions. Pinned here, a future move of
      # the default cannot reach the workflow. The name carries the shard
      # (`blob-1-6.json`) because all six artifacts are downloaded into one
      # directory with `merge-multiple: true`, where a fixed name would
      # overwrite five of them.
      #
      # On GitHub Actions the github-actions reporter is added as well. Vitest
      # adds it on its own only while no reporter is named, and this task names
      # two, so without it a failing test is a log line instead of an
      # annotation on the pull request's diff.
      #
      # COVERAGE=false leaves the instrumentation out: CI's push runs, whose
      # blobs nothing merges (the coverage comment is a pull request's).
      - bun run test:shard -- --shard={{.SHARD}} --reporter=default{{if .GITHUB_ACTIONS}} --reporter=github-actions{{end}} --outputFile=.vitest-reports/blob-{{.SHARD | replace "/" "-"}}.json{{if eq .COVERAGE "false"}} --coverage.enabled=false{{end}}

  fe:test:durations:
    desc: Re-record the per-file times the UI shards split by (tests/vitest-durations.json)
    dir: '{{.UI}}'
    cmds:
      # Re-run when the frontend shards' times in CI drift apart.
      - TZ=UTC bunx vitest run --reporter=json --outputFile=.vitest-reports/durations.json
      - node scripts/record-vitest-durations.mjs .vitest-reports/durations.json

  fe:test:related:
    desc: 'One shard of the UI specs that reach the given files (CI on a pull request: SHARD=1/8 FILES="...")'
    dir: '{{.UI}}'
    requires:
      vars: [SHARD, FILES]
    cmds:
      # `related` walks every spec's import graph and keeps the ones that reach
      # FILES (a spec named in FILES is kept as itself); `--shard` then splits
      # what is left. No coverage: a selection's coverage is a fraction of the
      # app, and a comment built from it would mislead. The full run on the
      # push to develop carries it. Each path is quoted: a Next route group
      # (`src/app/app/(shell)/…`) is a syntax error to the shell unquoted.
      - TZ=UTC bunx vitest related --run {{range splitList " " .FILES}}{{shellQuote .}} {{end}}--shard={{.SHARD}} --passWithNoTests --reporter=default{{if .GITHUB_ACTIONS}} --reporter=github-actions{{end}}

  fe:test:merge:
    desc: Merge sharded blob reports into one result + the coverage CI comments on
    dir: '{{.UI}}'
    cmds:
      - >-
        bun run test:merge --
        --coverage.reporter=json-summary --coverage.reporter=json
        --coverage.reporter=text-summary

  fe:build:
    desc: Production build of the UI
    dir: '{{.UI}}'
    cmds:
      - bun run build

  fe:provision:authz:
    desc: 'Check WorkOS authz drift against the catalog (add `-- --apply` to reconcile)'
    dir: '{{.UI}}'
    cmds:
      - bun run provision:authz {{.CLI_ARGS}}

  fe:provision:audit-schemas:
    desc: 'Check WorkOS audit-log schema drift against the registry (add `-- --apply` to reconcile)'
    dir: '{{.UI}}'
    cmds:
      - bun run provision:audit-schemas {{.CLI_ARGS}}

  fe:provision:flags:
    desc: 'Check every registry feature flag exists in WorkOS (read-only; needs WORKOS_API_KEY)'
    # Read-only and with no --apply: flag creation has no SDK binding, so the
    # fix is always a dashboard step. A registry slug WorkOS lacks is off for
    # every organization, which is why a missing one fails the run.
    dir: '{{.UI}}'
    cmds:
      - bun scripts/check-workos-flags.ts

  fe:provision:workos-env:
    desc: 'Check WorkOS environment identity drift (add `-- --apply` to reconcile)'
    dir: '{{.UI}}'
    cmds:
      - bun run provision:workos-env {{.CLI_ARGS}}

  fe:cards:check:
    desc: The committed Zod card schema still matches shared/cards/schemas.json
    # The other half of the `card-schemas` pre-commit hook. That hook skips this
    # stage where frontends/ui/node_modules is absent, which is every repo-lint
    # CI run, so the check lives here too and the frontend job runs it after
    # `fe:install`. Running the generator IS the check.
    cmds:
      - node frontends/ui/scripts/generate-card-schemas.mjs
      - git diff --exit-code -- frontends/ui/src/shared/cards/generated.ts

  fe:verify:
    desc: Everything CI runs for the frontend tier
    cmds:
      - task: fe:cards:check
      - task: fe:lint
      - task: fe:types
      - task: fe:blast-radius
      - task: fe:test:ci
      - task: fe:build
