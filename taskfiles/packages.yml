# Standalone packages (packages/).
#
# Included by the root Taskfile.yml with `flatten: true`: task names stay literal
# (`pkg:test`). Shared vars (UI, WEB, PY, ...) and env live in the root file.

version: '3'

tasks:
  # ── standalone packages (packages/) ─────────────────────────────────────────
  #
  # Two implementations of the same spatial surface over IFC (ADR-0045), each
  # OUTSIDE the workspace it sits next to: `ifc-spatial` has its own
  # bun.lock and is not in the UI's bun workspace; `ifc-spatial-py` has
  # its own uv.lock and is not in the root uv workspace. That is why they get
  # their own tasks instead of riding `fe:*` or `be:*` — neither toolchain can
  # see them.
  #
  # Until now nothing ran either suite: no Taskfile target, no CI job, no
  # pre-commit hook. 830 tests behind a default-ON feature that renders OIB
  # compliance verdicts, and the only thing standing between a broken assertion
  # and a customer was somebody remembering to run pytest by hand.

  pkg:install:
    desc: Install the standalone packages' own toolchains (own lockfiles, outside every workspace)
    cmds:
      # `--frozen-lockfile`: the lockfile is the contract here exactly as it is
      # for the UI and for deploy/pulumi.
      - bun install --frozen-lockfile --cwd packages/ifc-spatial
      # The Python package builds its env on first `uv run`; syncing here means
      # `pkg:test:py` measures the suite rather than the download.
      - uv sync --project packages/ifc-spatial-py --all-extras

  pkg:test:ts:
    desc: 'packages/ifc-spatial: tests + typecheck (own lockfile, ~10s)'
    cmds:
      - bun run --cwd packages/ifc-spatial test
      # `typecheck` runs BOTH tsconfigs — the source one and tsconfig.test.json.
      # A test file that no longer type-checks is how an operator contract
      # silently stops being asserted.
      - bun run --cwd packages/ifc-spatial typecheck

  pkg:test:py:
    desc: 'packages/ifc-spatial-py: pytest against its own uv.lock (636 tests, ~4 min)'
    cmds:
      # `--all-extras`, NOT `--extra dev`: pytest is the `dev` extra, and the
      # suite also collects test_ids_export.py, which needs `ifctester` from the
      # `ids` extra. Plain `uv run pytest` installs neither and collection dies.
      # `--project` rather than a `dir:`, so the path in the failure output is
      # the one you can paste back.
      - uv run --project packages/ifc-spatial-py --all-extras pytest packages/ifc-spatial-py/tests -q

  pkg:test:
    desc: Both standalone package suites (packages/ifc-spatial + ifc-spatial-py)
    cmds:
      - task: pkg:test:ts
      - task: pkg:test:py
