version: 2

# Free, auto-fix PRs for vulnerable/outdated dependencies. Complements
# OSV-Scanner (.github/workflows/security.yml), which blocks vulnerable deps in
# CI while Dependabot opens the PRs that fix them. Keep the dependency graph and
# Dependabot alerts enabled in repo Settings -> Code security.
#
# `cooldown` delays adopting a freshly-published release for a few days, so a
# compromised or yanked version has time to be caught before Dependabot opens a
# PR for it (supply-chain hardening; flagged by Semgrep's dependabot-missing-cooldown).
updates:
  # Python backend (uv workspace: pyproject.toml + uv.lock at the repo root).
  - package-ecosystem: uv
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Vienna
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      # Every minor and patch bump in one weekly PR; a major stays its own
      # PR, the one kind that needs reading. First matching group wins.
      python-minor-patch:
        applies-to: version-updates
        update-types: ["minor", "patch"]
      python-security:
        applies-to: security-updates
        patterns: ["*"]
    ignore:
      # Pinned exactly with the UI's @a2ui packages (ADR-0065): an A2UI upgrade
      # is its own change, both sides at once, not a line in the weekly group.
      - dependency-name: "a2ui-core"
      # deepagents 0.7 removed backend factories and made a draft write
      # overwrite instead of refusing (the researcher factory and the draft
      # store's create-only contract fail), and langchain-modal 0.0.6 requires
      # it. Moving the agent runtime to 0.7 is its own change.
      - dependency-name: "deepagents"
        versions: [">=0.7"]
      - dependency-name: "langchain-modal"
        versions: [">=0.0.6"]

  # Frontend (Next.js UI). bun.lock is its only lockfile; the Docker build and
  # CI install from it.
  - package-ecosystem: bun
    directory: "/frontends/ui"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Vienna
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      # Every minor and patch bump in one weekly PR; a major stays its own
      # PR, the one kind that needs reading. First matching group wins.
      ui-minor-patch:
        applies-to: version-updates
        update-types: ["minor", "patch"]
      ui-security:
        applies-to: security-updates
        patterns: ["*"]
      # Families that must move together, so a major of one moves the rest.
      # Bumped one at a time they drift apart and the build breaks:
      # @aws-sdk/client-s3 alone pulls newer @smithy types than
      # @aws-sdk/s3-request-presigner was built against, and typecheck fails;
      # @opentelemetry/sdk-logs alone (0.x, so every minor is breaking) leaves
      # api-logs and exporter-logs-otlp-http on an incompatible line.
      aws-sdk:
        patterns:
          - "@aws-sdk/*"
      opentelemetry:
        patterns:
          - "@opentelemetry/*"
    ignore:
      # A2UI is pinned exactly (ADR-0065): nearly every 0.x minor has broken its
      # API (0.13 moved every component into a custom element and changed the
      # catalog), so an upgrade is its own change gated by the `features/a2ui`
      # tests, not a line in the weekly group.
      - dependency-name: "@a2ui/*"
      # @ifc-lite/geometry 7.8.1 spawns a worker it does not ship
      # ('./geometry.worker.ts'), which fails `next build`, and every renderer
      # from 6.3.0 to 6.4.0 requires it. Exact versions only, so a release that
      # fixes the path still arrives (docs/contributing/gotchas.md).
      - dependency-name: "@ifc-lite/geometry"
        versions: ["7.8.1"]
      - dependency-name: "@ifc-lite/renderer"
        versions: ["6.3.0", "6.3.1", "6.3.2", "6.3.3", "6.4.0"]
      # `typescript-api` is TypeScript 6 under an npm alias, for the specs that
      # parse source with the compiler API TypeScript 7.0 does not ship
      # (ADR-0103). Moving it to 7 removes that API. It goes when 7.1's lands.
      - dependency-name: "typescript-api"
        versions: [">=7"]
      # The runtime is Node 22 (`FROM node:22-slim` in the Dockerfiles,
      # node-version "22" in CI), so newer @types/node majors type APIs that
      # crash at runtime. Lift this when the runtime moves to a new major, and
      # move @types/node with it.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  # Landing site (Astro microservice). bun.lock, like the UI's (ADR-0103).
  - package-ecosystem: bun
    directory: "/frontends/web"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Vienna
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      # Every minor and patch bump in one weekly PR; a major stays its own
      # PR, the one kind that needs reading. First matching group wins.
      web-minor-patch:
        applies-to: version-updates
        update-types: ["minor", "patch"]
      web-security:
        applies-to: security-updates
        patterns: ["*"]
    ignore:
      # Same reasons as frontends/ui: `astro check` runs on the TypeScript JS
      # API that TypeScript 7 drops, and the runtime is Node 22.
      - dependency-name: "typescript"
        versions: [">=7"]
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  # The Pulumi program and its policy pack. Bumping @pulumi/pulumi here also
  # moves the CLI the deploy installs (deploy.yml installs the locked SDK's
  # release), so the two can only move together, in a reviewed pull request.
  - package-ecosystem: bun
    directories:
      - "/deploy/pulumi"
      - "/deploy/pulumi/policy"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Vienna
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      # Every minor and patch bump in one weekly PR; a major stays its own
      # PR, the one kind that needs reading. First matching group wins.
      pulumi-minor-patch:
        applies-to: version-updates
        update-types: ["minor", "patch"]
      pulumi-security:
        applies-to: security-updates
        patterns: ["*"]
      pulumi:
        patterns: ["@pulumi/*"]
    ignore:
      # deploy.yml runs the program on Node 22 (node-version "22"); same rule
      # as frontends/ui above.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # `pulumi preview`/`up` load TypeScript through ts-node, which calls the
      # compiler's JS API (@pulumi/pulumi cmd/run/run.js `require(typescriptRequire)`).
      # TypeScript 7 ships no JS API, so `tsc --noEmit` stays green while every
      # deploy breaks. Same rule as frontends/web.
      - dependency-name: "typescript"
        versions: [">=7"]

  # Keep the Actions current. They are pinned by commit SHA with a version
  # comment (tests/test_ci_workflows.py), and Dependabot bumps both. "/" reads
  # .github/workflows only; the composite actions need their own directories,
  # or the actions they use are never updated.
  - package-ecosystem: github-actions
    directories:
      - "/"
      - "/.github/actions/*"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Vienna
    cooldown:
      default-days: 7
    groups:
      # Every minor and patch bump in one weekly PR; a major stays its own
      # PR, the one kind that needs reading. First matching group wins.
      actions-minor-patch:
        applies-to: version-updates
        update-types: ["minor", "patch"]
      actions-security:
        applies-to: security-updates
        patterns: ["*"]
