  # End of the files this tier's tests read.
# NOT here, though tests read them: `ci/**`, `releasenotes/**`, the other
# workflows and this file. Their tests (`task be:test:harness`: the workflow,
# plan-script and release-note suites, ~10s) run in the Repo checks job, which
# runs on every pull request. These lines used to send every change that
# carried a release note, which is most of them, through the whole 14-minute
# backend lane for those ten seconds.
# There was a `retrieval:` family here, feeding the `retrieval-eval` job. Both
# are gone: the gate measured the real OIB Richtlinien, and those became
# operator-provided and gitignored (data/oib/README.md), so no CI checkout can
# hold a corpus to measure. The paths it watched
# (packages/knowledge-layer, common/german_text.py, common/legal_terms.py,
# evals/oib-retrieval) are all inside `backend:` — the last of
# them only since the `evals/**` line above, added here so
# removing the filter did not leave the harness watched by nothing. So nothing
# lost a filter; only the job went. See ci.yml's `ci-ok` comment and ADR-0058's
# "Update (2026-09-09)".
frontend:
  - 'frontends/ui/**'
  # The BFF's model-config tests read the workflow config (the agent
  # groups it seeds are derived from `llms:`), so a PR touching only
  # `configs/` must still run them — otherwise a drift between the
  # two lands green because no frontend job ran at all.
  - 'configs/**'
  - 'Taskfile.yml'
  - 'taskfiles/frontend.yml'
  - '.github/workflows/ci.yml'
  - '.github/filters.yml'
  - '.github/actions/setup-bun/**'
  - '.github/actions/setup-task/**'
  # `scripts/rls-test-db.sh` IS the tenant-isolation gate. Without
  # this line a change to it leaves `frontend` false, the gate job
  # is skipped, and `ci-ok` counts skipped as passed — so a broken
  # row-level-security harness merges unverified. It is the only root
  # script the frontend jobs run (the UI's own are under frontends/ui).
  - 'scripts/rls-test-db.sh'
  # The card schema is generated from the card models and the JSON schema into the Zod module
  # the UI validates with, and `task fe:cards:check` is the only gate
  # that sees the Zod half (repo-lint has no node_modules). Without
  # these lines a models-only PR skips this job and ships a stale
  # `generated.ts`, which type-checks.
  - 'packages/agent/src/aiq_agent/cards/models.py'
  - 'packages/agent/src/aiq_agent/cards/card_model.py'
  - 'packages/agent/src/aiq_agent/cards/proposal_cards.py'
