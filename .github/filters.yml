# The two standalone IFC packages (ADR-0045). Their own family rather than a
# line in `backend:` or `frontend:`, because they are outside BOTH workspaces —
# own bun.lock, own uv.lock, own toolchains — so nothing the backend or
# frontend jobs install can run them, and a `packages/`-only PR has no reason to
# pay for a Next.js build. The `packages` job is ~4 minutes, essentially all of
# it packages/ifc-spatial-py, which is why it is filtered at all.
packages:
  # The IFC packages only: packages/brand has no suite of its own and is
  # checked by the site and frontend tiers (ADR-0145).
  - 'packages/ifc-spatial*/**'
  # The guide for both, beside them.
  - 'packages/*.md'
  - 'Taskfile.yml'
  - 'taskfiles/packages.yml'
  - '.github/workflows/ci.yml'
  - '.github/filters.yml'
  - '.github/actions/setup-bun/**'
  - '.github/actions/setup-task/**'
# The per-migration backfill and down checks at the end of
# scripts/rls-test-db.sh. They read only the migrations and the script, so the
# frontend job skips them unless one of those changed. The rest of the tenant
# isolation suite runs with the frontend tier as before.
migrations:
  - 'frontends/ui/drizzle/**'
  - 'scripts/rls-test-db.sh'
# The pull request SAST scan. Semgrep is diff-aware, so it only ever reports
# findings the change introduces; this decides whether there is code to scan.
sast:
  - 'frontends/**'
  - 'apps/**'
  - 'packages/**'
  - 'deploy/**'
  - 'scripts/**'
  - '.github/**'
