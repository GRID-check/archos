# Which paths belong to which tier of the test suite: the ONE definition, read
# by ci.yml's `changes` job through dorny/paths-filter.
#
# What this file answers is "which checks can this change break?". The filters
# are deliberately WIDE: each includes the harnesses, the Taskfile that defines
# the commands and the composite actions, so a change to how a job runs cannot
# merge without that job running. A tier that is skipped counts as passed, so
# every path missing here is a check that silently did not run. Every line below
# that carries a comment was somebody's merged-and-untested change.
#
# What this file does NOT answer is "which images does this change rebuild?".
# That used to be here too, as hand-written path lists per image, and they
# disagreed with the Dockerfiles (`packages/ifc-spatial-py/` is copied into the
# backend image and was in neither list). Images are now named by a hash of the
# files their Dockerfile actually copies: ci/image_inputs.py. Nor does it decide
# which third-party image pins trivy scans: ci/pinned_images.py.
#
# Adding a path: put it in the tier it belongs to, and say why if the reason is
# not obvious from the path. tests/test_ci_filter_coverage.py fails on any
# tracked path that no tier below names and that its UNFILTERED list does not
# excuse, so a directory move that forgets this file is caught.

# Every filter also watches the tooling its jobs depend on: the tier's own
# task file (taskfiles/<tier>.yml, which defines the commands the jobs run),
# the root Taskfile.yml (the variables every task reads) and the composite
# setup actions the jobs use. Otherwise a change to `fe:verify`,
# `infra:types` or a setup action merges without its job running. Only
# what a tier's jobs use: a new backend task does not run the UI suite.
backend:
  - 'src/**'
  - 'frontends/aiq_api/**'
  # The offline eval harnesses. `be:test:ci` runs `tests/benchmarks/`, which
  # imports them, so a harness-only change must still run the backend suite.
  # It used to arrive here via the `retrieval` filter; that filter is gone
  # (see below) and this line is what replaces it.
  - 'frontends/benchmarks/**'
  # The recorded wire v2 turns and their schema: the contract fixtures
  # tests/aiq_agent/common/test_wire_v2.py holds the producer to.
  - 'shared/wire/**'
  # Read by tests/aiq_agent/tools/workspace/test_english_only.py.
  - 'ci/german_stems.json'
  - 'sources/**'
  # The one-time Chroma exporter's own tests (`be:test:migration`).
  - 'deploy/migration/**'
  - 'tests/**'
  - 'configs/**'
  - 'scripts/**'
  - 'pyproject.toml'
  - 'uv.lock'
  - 'Taskfile.yml'
  - 'taskfiles/backend.yml'
  # ci.yml defines how this job runs, and the setup actions it uses build
  # its environment.
  - '.github/workflows/ci.yml'
  - '.github/actions/setup-python-env/**'
  - '.github/actions/setup-task/**'
# NOT here, though tests read them: `ci/**`, `releasenotes/**`, the other
# workflows and this file. Their tests (`task be:test:harness`: the workflow,
# plan-script and release-note suites, ~10s) run in the Repo checks job, which
# runs on every pull request. These lines used to send every change that
# carried a release note, which is most of them, through the whole 14-minute
# backend lane for those ten seconds.
# There was a `retrieval:` family here, feeding the `retrieval-eval` job. Both
# are gone: the gate measured the real OIB Richtlinien, and those became
# operator-provided and gitignored (data/oib/README.md), so no CI checkout can
# hold a corpus to measure. The paths it watched
# (sources/knowledge_layer, common/german_text.py, common/legal_terms.py,
# frontends/benchmarks/oib_retrieval) are all inside `backend:` — the last of
# them only since the `frontends/benchmarks/**` line above, added here so
# removing the filter did not leave the harness watched by nothing. So nothing
# lost a filter; only the job went. See ci.yml's `ci-ok` comment and ADR-0058's
# "Update (2026-09-09)".
frontend:
  - 'frontends/ui/**'
  # The BFF's model-config tests read the workflow config (the agent
  # groups it seeds are derived from `llms:`), so a PR touching only
  # `configs/` must still run them — otherwise a drift between the
  # two lands green because no frontend job ran at all.
  - 'configs/**'
  - 'Taskfile.yml'
  - 'taskfiles/frontend.yml'
  - '.github/workflows/ci.yml'
  - '.github/filters.yml'
  - '.github/actions/setup-bun/**'
  - '.github/actions/setup-task/**'
  # `scripts/rls-test-db.sh` IS the tenant-isolation gate. Without
  # this line a change to it leaves `frontend` false, the gate job
  # is skipped, and `ci-ok` counts skipped as passed — so a broken
  # row-level-security harness merges unverified. It is the only root
  # script the frontend jobs run (the UI's own are under frontends/ui).
  - 'scripts/rls-test-db.sh'
  # The card schema is generated from these two into the Zod module
  # the UI validates with, and `task fe:cards:check` is the only gate
  # that sees the Zod half (repo-lint has no node_modules). Without
  # these lines a models-only PR skips this job and ships a stale
  # `generated.ts`, which type-checks.
  - 'src/aiq_agent/cards/models.py'
  - 'shared/cards/schemas.json'
  # The same wire v2 recordings, read by the UI's store and socket specs
  # (frontends/ui/src/test-utils/wire-v2-fixtures.ts).
  - 'shared/wire/**'
  # Data the UI specs read from ci/ and .github/: the German stems
  # (english-names.spec.ts, english-only.spec.ts), the browser work loops
  # (browser-work-loops.spec.ts) and the image build action
  # (scripts/sourcemaps-wiring.spec.mjs).
  - 'ci/german_stems.json'
  - 'ci/browser_work_loops.json'
  - '.github/actions/build-image/**'
web:
  - 'frontends/web/**'
  # The brand master and the app's copy: web's `npm run check` holds both
  # apps' copies to the master (scripts/build-brand-assets.mjs --check).
  - 'shared/brand/**'
  - 'frontends/ui/src/app/icon.svg'
  # The app's riso art: exported from frontends/web/art/riso and held to its
  # JOBS tables by web's `npm run check` (art/riso/check.mjs).
  - 'frontends/ui/public/art/**'
  - 'frontends/ui/src/lib/art/**'
  - 'Taskfile.yml'
  - 'taskfiles/web.yml'
  - '.github/workflows/ci.yml'
  - '.github/filters.yml'
  - '.github/actions/setup-bun/**'
  - '.github/actions/setup-task/**'
infra:
  - 'deploy/**'
  # deploy/pulumi/src/data/qdrant-alerts.spec.ts reads the runbook it links.
  - 'docs/deployment/qdrant-runbook.md'
  - 'Taskfile.yml'
  - 'taskfiles/infra.yml'
  - '.github/workflows/ci.yml'
  - '.github/filters.yml'
  - '.github/actions/setup-bun/**'
  - '.github/actions/setup-task/**'
# The two standalone IFC packages (ADR-0045). Their own family rather than a
# line in `backend:` or `frontend:`, because they are outside BOTH workspaces —
# own bun.lock, own uv.lock, own toolchains — so nothing the backend or
# frontend jobs install can run them, and a `packages/`-only PR has no reason to
# pay for a Next.js build. The `packages` job is ~4 minutes, essentially all of
# it packages/ifc-spatial-py, which is why it is filtered at all.
packages:
  - 'packages/**'
  - 'Taskfile.yml'
  - 'taskfiles/packages.yml'
  - '.github/workflows/ci.yml'
  - '.github/filters.yml'
  - '.github/actions/setup-bun/**'
  - '.github/actions/setup-task/**'

# The per-migration backfill and down checks at the end of
# scripts/rls-test-db.sh. They read only the migrations and the script, so the
# frontend job skips them unless one of those changed. The rest of the tenant
# isolation suite runs with the frontend tier as before.
migrations:
  - 'frontends/ui/drizzle/**'
  - 'scripts/rls-test-db.sh'

# The pull request SAST scan. Semgrep is diff-aware, so it only ever reports
# findings the change introduces; this decides whether there is code to scan.
sast:
  - 'src/**'
  - 'frontends/**'
  - 'sources/**'
  - 'packages/**'
  - 'deploy/**'
  - 'scripts/**'
  - '.github/**'
