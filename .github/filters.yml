# Which paths belong to which tier of the test suite: the ONE definition, read
# by ci.yml's `changes` job through dorny/paths-filter.
#
# What this file answers is "which checks can this change break?". The filters
# are deliberately WIDE: each includes the harnesses, the Taskfile that defines
# the commands and the composite actions, so a change to how a job runs cannot
# merge without that job running. A tier that is skipped counts as passed, so
# every path missing here is a check that silently did not run. Every line below
# that carries a comment was somebody's merged-and-untested change.
#
# What this file does NOT answer is "which images does this change rebuild?".
# That used to be here too, as hand-written path lists per image, and they
# disagreed with the Dockerfiles (`packages/ifc-spatial-py/` is copied into the
# backend image and was in neither list). Images are now named by a hash of the
# files their Dockerfile actually copies: ci/image_inputs.py. Nor does it decide
# which third-party image pins trivy scans: ci/pinned_images.py.
#
# Adding a path: put it in the tier it belongs to, and say why if the reason is
# not obvious from the path. tests/test_ci_filter_coverage.py fails on any
# tracked path that no tier below names and that its UNFILTERED list does not
# excuse, so a directory move that forgets this file is caught.
#
# A test that reads another area's file as source (a Pulumi spec reading the
# env names a Python module reads, a backend test reading a BFF constant) must
# run when that file changes. The block at the end of each tier, between "Read
# as source by this tier's tests" and "End of the files this tier's tests read",
# lists those files and is written by `python scripts/check_ci_filter_reads.py
# --fix`; tests/test_ci_filter_reads.py fails when it differs from what the
# tests read. Edit the lines above each block by hand, never the block.

# Every filter also watches the tooling its jobs depend on: the tier's own
# task file (taskfiles/<tier>.yml, which defines the commands the jobs run),
# the root Taskfile.yml (the variables every task reads) and the composite
# setup actions the jobs use. Otherwise a change to `fe:verify`,
# `infra:types` or a setup action merges without its job running. Only
# what a tier's jobs use: a new backend task does not run the UI suite.
backend:
  - 'packages/agent/**'
  - 'apps/backend/**'
  # The eval harnesses and their tests: `be:test:ci` runs `evals/` beside
  # `tests/`, so a harness-only change must still run the backend suite.
  # It used to arrive here via the `retrieval` filter; that filter is gone
  # (see below) and this line is what replaces it.
  - 'evals/**'
  # The recorded wire v2 turns and their schema: the contract fixtures
  # packages/agent/tests/common/test_wire_v2.py holds the producer to.
  - 'contracts/wire/**'
  # Read by packages/agent/tests/tools/workspace/test_english_only.py.
  - 'ci/german_stems.json'
  # The Python packages (ADR-0145 row 6); ifc-spatial-py is the packages tier's.
  - 'packages/knowledge-layer/**'
  - 'packages/ris-adapter/**'
  - 'packages/tavily-web-search/**'
  # The one-time Chroma exporter's own tests (`be:test:migration`).
  - 'deploy/migration/**'
  - 'tests/**'
  - 'configs/**'
  - 'scripts/**'
  - 'pyproject.toml'
  - 'uv.lock'
  - 'Taskfile.yml'
  - 'taskfiles/backend.yml'
  # ci.yml defines how this job runs, and the setup actions it uses build
  # its environment.
  - '.github/workflows/ci.yml'
  - '.github/actions/setup-python-env/**'
  - '.github/actions/setup-task/**'
