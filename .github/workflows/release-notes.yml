name: Release notes

# Publishes the reno notes to the marketing site.
#
# On every merge to `develop` that touched `releasenotes/`, this regenerates
# `frontends/web/src/data/changelog.json` (translating the new English sentences
# into German once, and caching the result in `releasenotes/translations/de.json`)
# and commits it back. That commit is what puts the note in front of a reader:
# it triggers CI, which rebuilds the web image, which the staging deploy rolls
# out. Nothing here talks to the cluster.
#
# Why the artifact is generated here and not at image-build time: reno derives
# the release a note belongs to from git history, and the web Docker build has
# neither the history nor a Python toolchain. Generating once on merge keeps the
# image build hermetic — and keeps the German translation from being re-paid for
# on every build.
#
# One-time setup:
#   * The translator's OpenRouter key: keyless through OpenRouter's workload
#     identity federation when the repository variable
#     `OPENROUTER_FEDERATION_POLICY_ID` is set (docs/deployment/keyless-ci.md),
#     else the repository secret `OPENROUTER_API_KEY`. Without either the job
#     still runs and publishes the English text on the German page, with a
#     warning in the log.
#   * A GitHub App that may push to `develop`: repository variable
#     `RELEASE_APP_CLIENT_ID` and secret `RELEASE_APP_PRIVATE_KEY`, the app
#     installed on this repository with `contents: write` and listed as a bypass
#     actor on the `develop` rulesets (docs/deployment/keyless-ci.md). The
#     `protect-develop` ruleset requires changes to arrive via pull request, and
#     GitHub refuses the Actions integration itself as a ruleset bypass actor
#     (422 "must be part of the ruleset source or owner organization"), so the
#     push below runs as the app, with a token that lives one hour. A push made
#     with an app token triggers CI, which a GITHUB_TOKEN push would not.
#     Until the app exists, the repository secret `RELEASE_PAT` (a fine-grained
#     PAT with `contents: write`, owned by an admin on the bypass list) serves;
#     neither set falls back to `GITHUB_TOKEN`, which keeps the workflow usable
#     in forks and other contexts without that ruleset.
#
# The commit is made with `[skip actions]`-free, ordinary content: it must
# trigger the downstream image build, or the note never reaches the website. It
# cannot loop, because the path filter below only fires on `releasenotes/**` and
# this job only ever writes under `frontends/web/src/data/` and
# `releasenotes/translations/`.

on:
  push:
    branches: [develop]
    paths:
      - releasenotes/notes/**
      - releasenotes/config.yaml
      - releasenotes/summaries.yaml
      - scripts/release_notes.py
      - .github/workflows/release-notes.yml
  # Validate the pipeline on demand — regeneration and translation resolution
  # run, but nothing is committed: publishing is gated to pushes on `develop`
  # (see the commit step). To republish for real, re-run a failed develop run,
  # which keeps its original `push` context.
  workflow_dispatch:

permissions:
  contents: write
  id-token: write # the OpenRouter login exchanges the job's OIDC token

concurrency:
  group: release-notes
  cancel-in-progress: false

jobs:
  publish:
    name: Publish changelog to the website
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # A one-hour installation token of the release app (see the header),
      # revoked when the job ends.
      - name: Mint the release app's token
        id: app-token
        if: vars.RELEASE_APP_CLIENT_ID != ''
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # reno reads release history from git; a shallow clone gives it none
          # (documented upstream, and it fails outright rather than degrading).
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token || secrets.RELEASE_PAT || secrets.GITHUB_TOKEN }}

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true

      # A 15-minute OpenRouter key when OPENROUTER_FEDERATION_POLICY_ID is set;
      # this job finishes well inside that. A masked output, handed below only
      # to the two steps that translate.
      - name: Log in to OpenRouter
        id: openrouter
        if: vars.OPENROUTER_FEDERATION_POLICY_ID != ''
        uses: ./.github/actions/openrouter-login
        with:
          federation-policy-id: ${{ vars.OPENROUTER_FEDERATION_POLICY_ID }}

      - name: Regenerate the changelog
        # Step-level, not job-level: the translator key reaches only the two
        # steps that translate, never the third-party setup actions.
        env:
          OPENROUTER_API_KEY: ${{ steps.openrouter.outputs.key || secrets.OPENROUTER_API_KEY }}
          # Same default the script carries; set here so the model can be moved
          # without a code change.
          RELEASE_NOTES_TRANSLATION_MODEL: ${{ vars.RELEASE_NOTES_TRANSLATION_MODEL || 'openai/gpt-6-luna' }}
          # With a key present, an untranslated note is a failure — shipping
          # English onto the German page is the thing this workflow exists to
          # prevent. Without one it is a warning, and the site stays live.
          # Through env, so no `${{ }}` reaches a shell (run-shell-injection).
          REQUIRE: ${{ (steps.openrouter.outputs.key != '' || secrets.OPENROUTER_API_KEY != '') && '--require-translations' || '' }}
        run: uv run --no-project --with reno==4.1.0 python scripts/release_notes.py publish $REQUIRE

      - name: Commit and push
        # Publishing is a develop-push behavior only. Every other context —
        # workflow_dispatch, or a future pull_request trigger — regenerates
        # read-only above and never commits, switches branches, or pushes.
        if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
        env:
          OPENROUTER_API_KEY: ${{ steps.openrouter.outputs.key || secrets.OPENROUTER_API_KEY }}
          RELEASE_NOTES_TRANSLATION_MODEL: ${{ vars.RELEASE_NOTES_TRANSLATION_MODEL || 'openai/gpt-6-luna' }}
          REQUIRE: ${{ (steps.openrouter.outputs.key != '' || secrets.OPENROUTER_API_KEY != '') && '--require-translations' || '' }}
        run: |
          set -euo pipefail
          files=(frontends/web/src/data/changelog.json releasenotes/translations/)
          for attempt in 1 2 3 4; do
            git fetch -q origin develop
            # The changelog is a function of the notes at the tip. When develop
            # has moved on (another merge, or the previous run's own changelog
            # commit), regenerate on top of it. Rebasing a generated file onto
            # another version of itself conflicts, and that conflict is how a
            # merge train used to leave this workflow red with nothing wrong.
            if [ "$(git rev-parse origin/develop)" != "$(git rev-parse HEAD)" ]; then
              git reset -q --hard origin/develop
              uv run --no-project --with reno==4.1.0 python scripts/release_notes.py publish $REQUIRE
            fi
            if git diff --quiet -- "${files[@]}"; then
              echo "Changelog already up to date — nothing to publish."
              exit 0
            fi
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add "${files[@]}"
            git commit -q \
              -m "docs(changelog): publish release notes to the website" \
              -m "Generated by scripts/release_notes.py from releasenotes/notes/."
            git push origin HEAD:develop && exit 0
            echo "push failed (attempt $attempt), regenerating on the new tip"
            sleep $((2 ** attempt))
          done
          echo "Could not push the changelog to develop." >&2
          echo "If this is a branch-protection rejection, see the header of this workflow." >&2
          exit 1
