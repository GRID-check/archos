name: PR

# PR hygiene automation. Uses pull_request_target (base-repo context, so it can
# label and comment on PRs) but NEVER checks out or runs PR code — it only reads
# the event payload and the base-branch config, so it is safe with the write
# token.
on:
  pull_request_target:
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  title:
    name: Conventional PR title
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # The repo uses Conventional Commits and squash-merges the PR title, so
      # the title must itself be a valid conventional-commit subject.
      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            refactor
            perf
            test
            ci
            build
            chore
            revert

  closing-keywords:
    name: Closing keywords
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # GitHub closes an issue on merge only when a closing keyword stands
      # directly before its number: "Fixes #1, #2" closes #1 and leaves #2
      # open. #756 listed 40 issues that way and closed one. The body is read
      # from the event payload through the environment, never interpolated
      # into the script.
      - name: One keyword per issue
        shell: python
        env:
          BODY: ${{ github.event.pull_request.body }}
        run: |
          import os
          import re

          # Hidden template instructions are not issue-closing references.
          body = re.sub(r"<!--.*?-->", "", os.environ.get("BODY", ""), flags=re.DOTALL)
          pattern = re.compile(
              r"\b(close[sd]?|fix(e[sd])?|resolve[sd]?)\b:?\s+#[0-9]+\s*(,|\band\b|&)\s*#[0-9]+",
              re.IGNORECASE,
          )
          matches = list(pattern.finditer(body))
          if matches:
              for match in matches:
                  print(f"  {match.group()}")
              print("::error::A closing keyword is followed by a list of issues, and GitHub closes only the first. Write the keyword before every number: 'Fixes #1, fixes #2'.")
              raise SystemExit(1)

  learnings:
    name: What we learned
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # AGENTS.md, "Everything you learn is written down": a fact somebody had
      # to find out, by hand or through a subagent's report, is written into
      # the repo in the same change, and the PR lists each one with the file it
      # went to. The scratch reports die with the session; this section is the
      # receipt that nothing was left there. The body is read from the event
      # payload through the environment, never interpolated into the script.
      - name: The section is present and filled
        shell: python
        env:
          BODY: ${{ github.event.pull_request.body }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          import os
          import re

          # Dependency bumps carry no research of their own.
          if os.environ.get("AUTHOR", "").endswith("[bot]"):
              raise SystemExit(0)
          body = re.sub(r"<!--.*?-->", "", os.environ.get("BODY", ""), flags=re.DOTALL)
          section = re.search(
              r"^#{2,4}\s*What we learned\s*$(.*?)(?=^#{1,4}\s|\Z)",
              body,
              flags=re.IGNORECASE | re.MULTILINE | re.DOTALL,
          )
          if not section:
              print("::error::The PR body has no '#### What we learned' section. List each fact about the system you had to find out, re-checked in the code, with the file it now lives in; or write 'Nothing new, because ...'. AGENTS.md, 'Everything you learn is written down'.")
              raise SystemExit(1)
          text = section.group(1).strip()
          if len(text) < 20:
              print("::error::'What we learned' is empty. Name each fact and the file it went to, or write 'Nothing new, because ...' with the reason.")
              raise SystemExit(1)

  label:
    name: Auto-label by path
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Never block a PR on labeling (e.g. before the labels-as-code sync has
    # seeded them, or a transient labels API hiccup).
    continue-on-error: true
    steps:
      - uses: actions/labeler@bf12e9b00b37c5c0ca2b87b79b2daf7891dbda13 # v7.0.0
        with:
          sync-labels: true
