name: CI

# The one pipeline, with two jobs to do:
#
#   pull_request  The merge gate. Prove the change, applied to its base, keeps
#                 every check a change of its shape can break. `CI OK` is the
#                 single required status check.
#   push          The release gate, on develop and release/**. Prove the merged
#                 result, build the images for exactly that tree, and tag them
#                 for the commit only once every check has passed. Deploy
#                 (deploy.yml) follows a green push run and nothing else, so a
#                 commit with `sha-<commit>` images is a commit CI passed.
#
# Three rules decide how much runs, and each exists because its absence cost
# something measurable. docs/contributing/ci.md has the numbers.
#
#   1. Run what the change can break. `changes` diffs a pull request against its
#      base, and a push against the LAST COMMIT CI PASSED on that branch
#      (ci/last_green.py), never against the previous push. A red commit's tier
#      therefore keeps running until something makes it green.
#   2. Never test the same thing twice. A push whose tree a green pull request
#      run already tested, on top of a green parent, skips every check
#      (ci/reuse_green_run.py). An image whose inputs GHCR already has is
#      re-tagged, not rebuilt (ci/image_inputs.py).
#   3. Spend runner slots like they are scarce, because they are. Runs queue for
#      a free runner, so a job that saves thirty seconds of work but costs a
#      slot makes everyone slower. Work that shares a toolchain shares a job.
on:
  push:
    branches: [develop, "release/**"]
  pull_request:
    # `claude/**`: a PR stacked on another PR's branch gets the same gate as
    # one that targets develop, instead of nothing until the PR below merges.
    branches: [develop, "release/**", "claude/**"]

permissions:
  contents: read

concurrency:
  # One group per pull request and one per branch.
  #
  # A pull request's newer push cancels its older run: every run diffs the
  # whole PR, so the newer one owes everything the older one did.
  #
  # A branch's runs are never cancelled mid-flight, and a run that is still
  # QUEUED is replaced by a newer push (GitHub keeps one pending run per group).
  # That is what makes a merge train cheap: nine quick merges cost the run in
  # progress plus one more, not nine. It is safe only because a push diffs
  # against the last green commit (rule 1), so the run that survives covers
  # every commit that was dropped. Deploy reads a dropped run as superseded.
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Image references must be lowercase, and nothing lowercases this one for us.
  REGISTRY: ghcr.io/grid-check

jobs:
  changes:
    name: Plan
    runs-on: ubuntu-latest
    # Every job has a timeout of a few times its measured run. GitHub's
    # default is 360 minutes, and a hung job holds one of the capped runner
    # slots for all of them while every queued run waits behind it.
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read # the last green run, and a pull request run's green marker
      packages: read # whether GHCR already has an image with these inputs
    outputs:
      # 'true' when this push's tree already passed in full on its pull request.
      # The filter then does not run, every tier reads 'false', every check
      # skips. Images are still planned: a pull request builds, never pushes.
      reused: ${{ steps.reuse.outputs.hit || 'false' }}
      backend: ${{ steps.filter.outputs.backend || 'false' }}
      frontend: ${{ steps.filter.outputs.frontend || 'false' }}
      site: ${{ steps.filter.outputs.site || 'false' }}
      infra: ${{ steps.filter.outputs.infra || 'false' }}
      packages: ${{ steps.filter.outputs.packages || 'false' }}
      migrations: ${{ steps.filter.outputs.migrations || 'false' }}
      sast: ${{ steps.filter.outputs.sast || 'false' }}
      # The images this run builds (a matrix), and all three with their hashes.
      build: ${{ steps.images.outputs.build }}
      images: ${{ steps.images.outputs.images }}
      # Third-party image pins this change adds or moves, for trivy.
      pins: ${{ steps.pins.outputs.pins || '[]' }}
      # What a pull request's test lanes run: 'select' only the tests its
      # change reaches, 'full' the sharded, coverage-gated suite, 'none' (UI)
      # nothing. A push is always full. Reaches since what is `reference`:
      # 'green' its last green run, 'base' the whole pull request against
      # develop. ci/pr_selection.py says why, in this job's log.
      backend_mode: ${{ steps.pysel.outputs.py_mode || 'full' }}
      py_reference: ${{ steps.pysel.outputs.reference || 'base' }}
      py_extra: ${{ steps.pysel.outputs.py_extra || '[]' }}
      ui_mode: ${{ steps.pysel.outputs.ui_mode || 'full' }}
      ui_files: ${{ steps.pysel.outputs.ui_files || '[]' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          # Every commit and tree, no file contents: the diff base, the merge
          # base and `git diff --name-only` need only those. The full history
          # is 1.1 GB and fetching it cost this job, which every other job
          # waits for, ~29s; blobless it is 16 MB. The few blobs the image and
          # pin scripts read at the base are fetched on demand by the two
          # steps below that source ci/git_auth.sh.
          filter: blob:none
          # synchronize checks out the PR head. The default PR checkout is a
          # merge commit, which would mix develop into the diff.
          ref: ${{ github.event.action == 'synchronize' && (github.event.pull_request.head.sha || github.sha) || github.sha }}

      # Push only. Not continue-on-error on purpose: the script falls back to
      # the root commit (everything runs) on any lookup failure, so a failure
      # of the step itself is a broken checkout, and it should say so loudly
      # rather than leave the filter without a base.
      - name: Last commit CI passed on this branch
        id: green
        if: github.event_name == 'push'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 ci/last_green.py

      # A squash merge onto a base that has not moved lands exactly the tree the
      # PR's last run tested. That result counts only on top of a green parent:
      # a PR run that skipped the backend because it did not touch it proves
      # nothing about a backend that was already red on develop. A miss, or a
      # failure of this step, runs everything.
      - name: Reuse the pull request's green result for this tree
        id: reuse
        if: steps.green.outputs.parent-is-green == 'true'
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 ci/reuse_green_run.py ci-green

      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        if: steps.reuse.outputs.hit != 'true'
        with:
          # What each tier means and why it is wide: .github/filters.yml
          filters: .github/filters.yml
          # Empty token -> git diff, so `base` is honoured on pull_request too.
          token: ''
          base: ${{ github.event.pull_request.base.sha || steps.green.outputs.sha }}

      # A pull request builds an image when it changes what goes into it. A push
      # builds one when GHCR has no image with these inputs yet, whatever the
      # diff, so a dropped run, a failed build or a new week costs a rebuild and
      # never a missing image.
      - name: Images this run must build
        id: images
        env:
          GH_TOKEN: ${{ github.token }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          . ci/git_auth.sh
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            python3 ci/image_inputs.py plan --base "$BASE"
          else
            python3 ci/image_inputs.py plan --registry "$GITHUB_REPOSITORY_OWNER"
          fi

      - name: Tests this change reaches
        id: pysel
        if: github.event_name == 'pull_request' && (steps.filter.outputs.backend == 'true' || steps.filter.outputs.frontend == 'true')
        # A failure here leaves every mode unset, which reads 'full'.
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_HEAD_REF: ${{ github.head_ref }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: python3 ci/pr_selection.py "$BASE"

      - name: Image pins this change adds
        id: pins
        if: steps.reuse.outputs.hit != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          BASE: ${{ github.event.pull_request.base.sha || steps.green.outputs.sha }}
        run: |
          . ci/git_auth.sh
          python3 ci/pinned_images.py new "$BASE"

      # A skipped job reads as passed, so the run page says what was decided
      # and why: the diff base, reuse, tiers, images, pins.
      - name: Summary
        if: always()
        continue-on-error: true
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha || steps.green.outputs.sha }}
          BASE_REASON: ${{ steps.green.outputs.reason }}
          REUSED: ${{ steps.reuse.outputs.hit }}
          TIERS: ${{ toJSON(steps.filter.outputs) }}
          BUILD: ${{ steps.images.outputs.build }}
          IMAGES: ${{ steps.images.outputs.images }}
          PINS: ${{ steps.pins.outputs.pins }}
        run: python3 ci/plan_summary.py >> "$GITHUB_STEP_SUMMARY"

  # Whole-repo checks, deliberately behind no path filter: they lint every file,
  # so gating them on a tier would let a deploy/-only PR land drift that stays
  # invisible until an unrelated PR trips over it. Whoever introduces the drift
  # is the one who sees it. One job, because every step needs the same Python
  # environment and none is slow enough to be worth a runner slot of its own.
  repo:
    name: Repo checks (lint, release notes, secrets)
    needs: changes
    if: needs.changes.outputs.reused != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read # the no-release-note label, read when the job runs
    steps:
      # No persisted checkout token: this job runs repository-defined pre-commit
      # hooks, which never need a credential (hook repos clone anonymously).
      # A pull request starts shallow and fetches only down to its merge base,
      # which is all the release-note rule and gitleaks read; the full history
      # was 1.1 GB and ~75 s of every PR's critical path
      # (docs/audit/blast-radius-2026-10.md §7). reno alone needs the whole
      # history, and only when the notes change (below). A push keeps the full
      # clone: its gitleaks scan reads every commit.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: ${{ github.event_name == 'pull_request' && 1 || 0 }}
      - name: Fetch down to the merge base
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          . ci/git_auth.sh
          ci/fetch_merge_base.sh "$BASE_SHA" "$HEAD_SHA"
      - uses: ./.github/actions/setup-python-env
      # pre-commit builds an isolated env per hook repo, and they only change
      # when a `rev:` does: ~25s of env building becomes ~0.3s warm. The
      # interpreter path is in the key because pre-commit rebuilds an env whose
      # pyvenv.cfg names another one, and setup-python floats the patch version.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ env.pythonLocation }}-${{ hashFiles('.pre-commit-config.yaml') }}
          restore-keys: |
            pre-commit-${{ runner.os }}-${{ env.pythonLocation }}-
      # Ruff runs once, in `Backend lint` below, where its findings become
      # annotations on the diff.
      - name: Pre-commit (all hooks, all files)
        env:
          SKIP: ruff-check,ruff-format
        run: |
          . .venv/bin/activate
          pre-commit run --all-files
      - uses: ./.github/actions/setup-task
      # `skills/` is the source, `.claude/` and `.agents/` are generated and
      # gitignored, and apm.lock.yaml hashes both, so a skill edit that was
      # never re-locked appears in no diff at all. `apm audit` exits 0 on
      # drift; `task agents:audit` is the wrapper that does not.
      - name: Agent-skill lockfile (apm)
        run: task agents:audit
      # `github` output makes each finding an annotation on the diff.
      - name: Backend lint (ruff)
        run: task be:lint -- --output-format=github
      # The tests of ci/, the workflows and the release-note pipeline. Here
      # rather than only in the backend suite, so the backend filter need not
      # fire for a change that only touches those (.github/filters.yml).
      - name: Repository machinery tests (CI, release notes)
        run: task be:test:harness
      # The notes are published verbatim to piloti.at, so their prose is linted
      # on every run, a push straight to release/** included. reno's own lint
      # reads the notes through the whole git history, and its verdict changes
      # only with the notes, reno's config or its pin, so a pull request that
      # touches none of them skips that part rather than fetch 1.1 GB for it.
      - name: Release notes (lint)
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ -n "$BASE_SHA" ] && git diff --quiet "$BASE_SHA...HEAD" -- releasenotes/ Taskfile.yml taskfiles/repo.yml; then
            echo "No change to the notes, reno's config or its pin: house rules only."
            task release:lint:house
          else
            . ci/git_auth.sh
            task release:lint
          fi
      # AGENTS.md: a change a customer can notice ships with its note. The
      # escape hatch is the `no-release-note` label, read from the PR as it is
      # NOW rather than from the event payload: a re-run replays the payload, so
      # a label added after the push used to need another commit. Add the
      # label, then re-run this job.
      - name: Release notes (required for user-visible changes)
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" --jq '.labels[].name' | grep -qx 'no-release-note'; then
            echo "Labelled no-release-note: no note required."
            exit 0
          fi
          python3 ci/require_release_note.py "$BASE_SHA" "$HEAD_SHA"
      # Every commit the change adds, not only its final diff, so a secret is
      # caught in the commit that added it even when a later one deletes it.
      # On a pull request that is base..HEAD: the commits under the base were
      # scanned when they landed, and the weekly Security run reads the whole
      # history of every branch. A push reads its own full history. Not
      # `--all`, gitleaks' default: a full-depth checkout fetches every
      # branch, and an open PR's fixture then failed every other PR's run.
      # Exceptions: CONTRIBUTING.md "Secret scanning".
      - name: Secret scan (gitleaks)
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          range="--full-history HEAD"
          if [ -n "$BASE_SHA" ]; then range="$BASE_SHA..HEAD"; fi
          docker run --rm -v "$GITHUB_WORKSPACE:/repo" \
            zricethezav/gitleaks:v8.30.1 detect --source /repo --redact -v \
            --log-opts="$range"

  # Diff-aware: `semgrep ci` on a pull request reports only findings the change
  # introduces, so it blocks a new finding without failing on the backlog. A
  # push has nothing new to find that its pull request did not, and the
  # full-tree report is advisory, so it lives in the weekly Security run.
  semgrep:
    name: SAST (Semgrep, new findings)
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.sast == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      # Pinned: an unpinned scanner image changes the rules under a PR that
      # did not change, and nobody can tell which version said what.
      image: semgrep/semgrep:1.177.0
    steps:
      # Shallow, on purpose: `semgrep ci` finds the merge base itself, asking
      # the GitHub API first (GH_TOKEN below) and deepening the clone only if
      # that fails. The full history cost ~72 s (docs/audit/blast-radius-2026-10.md §7).
      # The checkout keeps its token so that fallback fetch can run.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # p/github-actions includes the mutable-action-tag rule, so an action
      # referenced by tag instead of commit SHA is a new finding here.
      - name: Semgrep scan
        run: >-
          semgrep ci --json-output=semgrep.json
          --exclude-rule javascript.lang.security.audit.unsafe-formatstring.unsafe-formatstring
        env:
          SEMGREP_RULES: p/default p/javascript p/typescript p/python p/secrets p/github-actions
          GH_TOKEN: ${{ github.token }}
      - name: Findings summary
        if: always()
        continue-on-error: true
        run: python3 ci/semgrep_summary.py semgrep.json "new findings this pull request introduces" >> "$GITHUB_STEP_SUMMARY"

  # The core suite, in four shards. It is ~900 CPU-seconds on a 2-vCPU runner
  # and nothing in it dominates (docs/contributing/ci.md#the-backend-lane), so
  # as one job it was the whole run's critical path: 7-8 of a 14-minute run,
  # with the other suites queued behind it in the same job. Each shard takes
  # its share by recorded test time (pytest-split), writes coverage data and
  # gates nothing; `backend-coverage` combines the data and applies the gate.
  backend:
    name: Backend core (shard ${{ matrix.shard }}/4)
    needs: changes
    if: needs.changes.outputs.backend == 'true' && (github.event_name == 'push' || needs.changes.outputs.backend_mode == 'full')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      # One shard's failure should not hide the others' results.
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    # A real Qdrant for every Python suite (ADR-0115): it is the only vector
    # store, and the behaviour under test (German BM25, fusion, strict mode,
    # group_by) is the server's, so a mock would only test the mock. Same
    # version as production. In every backend job, so a suite that gains a
    # store test cannot run it against nothing.
    services:
      qdrant:
        image: qdrant/qdrant:v1.19.2
        ports:
          - 6333:6333
    env:
      GRID_QDRANT_TEST_URL: http://localhost:6333
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # ONE interpreter, the one the backend image ships (apps/backend/Dockerfile).
      - uses: ./.github/actions/setup-python-env
        with:
          python-version: "3.14"
      - uses: ./.github/actions/setup-task
      - name: Core suite, shard ${{ matrix.shard }}/4
        run: task be:test:shard SHARD=${{ matrix.shard }}/4
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: backend-coverage-${{ matrix.shard }}
          path: .coverage.shard${{ matrix.shard }}
          include-hidden-files: true
          retention-days: 1

  # The core suite's coverage gate (65% of src/aiq_agent) over all four shards,
  # and the PR comment. In `CI OK`, unlike the frontend's comment-only merge,
  # because the gate is a check.
  backend-coverage:
    name: Backend coverage gate
    needs: [changes, backend]
    if: needs.changes.outputs.backend == 'true' && (github.event_name == 'push' || needs.changes.outputs.backend_mode == 'full')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write # coverage sticky comment
    steps:
      # The sources the data names, for the report; no environment beyond
      # coverage itself, at the version the shards ran.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: backend-coverage-*
          merge-multiple: true
      - name: Combine the shards and apply the gate
        run: |
          coverage="coverage==$(uv export --frozen --only-group dev --no-hashes --no-emit-workspace | sed -n 's/^coverage==\([^ ;]*\).*/\1/p')"
          # The shards' interpreter: coverage re-parses every source file, and
          # the runner's own 3.12 cannot read 3.14 syntax (`except A, B:`).
          uvx --python 3.14 --from "$coverage" coverage combine --keep .coverage.shard*
          uvx --python 3.14 --from "$coverage" coverage xml -o coverage.xml
          uvx --python 3.14 --from "$coverage" coverage report --fail-under=65
      - name: Coverage comment (backend)
        if: github.event_name == 'pull_request'
        continue-on-error: true # never fail CI on a comment hiccup
        uses: MishaKav/pytest-coverage-comment@9ee59af31bd7bcada1cc496f086b407122602dbd # v1.12.3
        with:
          pytest-xml-coverage-path: coverage.xml
          # The whole-tree table passed GitHub's 65,536-character comment
          # limit, and the action then posted only the badge.
          report-only-changed-files: true
          title: Backend coverage (src/aiq_agent)
          unique-id-for-comment: backend-coverage

  # Every Python suite but the core one, one job each. Run back to back in one
  # job they took 4:50 (sources 2:32, aiq_api 1:00, the rest 0:36), the
  # longest job of a full pull request; side by side the longest is sources.
  backend-suites:
    name: Backend suites (${{ matrix.suite }})
    needs: changes
    if: needs.changes.outputs.backend == 'true' && (github.event_name == 'push' || needs.changes.outputs.backend_mode == 'full')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        suite: [aiq_api, sources, migration and claim queues]
    services:
      qdrant:
        image: qdrant/qdrant:v1.19.2
        ports:
          - 6333:6333
    env:
      GRID_QDRANT_TEST_URL: http://localhost:6333
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-python-env
        with:
          python-version: "3.14"
      - uses: ./.github/actions/setup-task
      - name: aiq_api plugin suite
        if: matrix.suite == 'aiq_api'
        run: task be:test:api
      - name: Python package suites (packages/knowledge-layer, ris-adapter, tavily-web-search)
        if: matrix.suite == 'sources'
        run: task be:test:sources
      - name: Chroma exporter and the one-time migration, end to end
        if: matrix.suite == 'migration and claim queues'
        run: task be:test:migration

      # The suites above run each claim queue on SQLite only: their Postgres
      # parameter skips without GRID_TEST_POSTGRES_URL, and production runs the
      # Postgres SQL. ubuntu-latest ships the server binaries; the RLS script
      # builds the throwaway cluster, as in the frontend job.
      - name: Claim queues on real Postgres
        if: matrix.suite == 'migration and claim queues'
        run: task be:test:postgres
        env:
          # Turns "the Postgres branch skipped" into a failure for THIS step only.
          GRID_TEST_POSTGRES_REQUIRED: "1"

  # A pull request whose change testmon can see runs only the tests that
  # change reaches, per suite, from the database the last green develop push
  # recorded (`backend-testmon`). The full sharded suite and the coverage gate
  # run on every push to develop, which the deploy waits for, so a test this
  # selection misses still turns develop red before staging. What forces the
  # full suite on a pull request instead: ci/pr_selection.py.
  #
  # The core selection runs in four shards. A change to a module every test
  # imports (logging, the conftest) selects the whole suite, and half the
  # selections measured on 2026-10-22 were that: 15,200 tests in 4-5.5 minutes
  # in one job, longer than the full suite's shards. pytest-split splits what
  # testmon selected, so the shards must select from the same database: they
  # read develop's and keep none of their own.
  backend-affected:
    name: Backend affected tests (${{ matrix.suite }}${{ matrix.shard && format(' {0}/4', matrix.shard) || '' }})
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.backend == 'true' && needs.changes.outputs.backend_mode == 'select'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - { suite: core, shard: 1 }
          - { suite: core, shard: 2 }
          - { suite: core, shard: 3 }
          - { suite: core, shard: 4 }
          - { suite: api }
          - { suite: sources }
    services:
      qdrant:
        image: qdrant/qdrant:v1.19.2
        ports:
          - 6333:6333
    env:
      GRID_QDRANT_TEST_URL: http://localhost:6333
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-python-env
        with:
          python-version: "3.14"
      - uses: ./.github/actions/setup-task
      # This pull request's own database first: it carries what the last push
      # ran, so the next push re-runs only what it changed (and anything that
      # failed, which testmon keeps selecting until it passes). Else develop's,
      # which is all a core shard reads (above). Develop's too when the plan
      # selected against the whole pull request (`py_reference: base`): that
      # selection is sound only measured from develop, and from this pull
      # request's database it would skip a test whose file it changed earlier.
      - name: Restore this pull request's test database
        id: own-db
        if: ${{ !matrix.shard && needs.changes.outputs.py_reference == 'green' }}
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .testmondata-${{ matrix.suite }}
          key: testmon-pr-${{ github.event.pull_request.number }}-${{ matrix.suite }}-${{ github.sha }}
          restore-keys: |
            testmon-pr-${{ github.event.pull_request.number }}-${{ matrix.suite }}-
      # Its own step, with the path `backend-testmon` saves under: a cache is
      # found only by the paths it was saved with, and when this was one step
      # with the suite's own path, develop's database was never found and a
      # first push ran every test.
      - name: Restore develop's test database
        if: steps.own-db.outputs.cache-matched-key == ''
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .testmondata-*
          key: testmon-develop-${{ github.event.pull_request.base.sha }}
          restore-keys: |
            testmon-develop-
      - name: The ${{ matrix.suite }} tests this change reaches
        id: affected
        env:
          SUITE: ${{ matrix.suite }}
          SHARD: ${{ matrix.shard && format('{0}/4', matrix.shard) || '' }}
          EXTRA_JSON: ${{ needs.changes.outputs.py_extra }}
        run: |
          # The named test files that belong to this suite, in its first shard.
          case "$SUITE" in core) root='^(tests|evals)/' ;; api) root='^apps/backend/tests/' ;; sources) root='^packages/(knowledge-layer|ris-adapter|tavily-web-search)/' ;; esac
          extra=""
          if [ -z "$SHARD" ] || [ "${SHARD%%/*}" = 1 ]; then
            extra="$(jq -r --arg root "$root" '[.[] | select(test($root))] | join(" ")' <<<"$EXTRA_JSON")"
          fi
          task be:test:affected SUITE="$SUITE" SHARD="$SHARD" EXTRA="$extra"
      # Saved red or green: a failed test is recorded as failed and re-runs.
      - name: Keep this pull request's database for its next push
        if: always() && steps.affected.outcome != 'skipped' && !matrix.shard
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .testmondata-${{ matrix.suite }}
          key: testmon-pr-${{ github.event.pull_request.number }}-${{ matrix.suite }}-${{ github.sha }}
      # Production's claim SQL, beside the suite whose queue it is cheapest to
      # pair with. 14 seconds; not worth selecting.
      - name: Claim queues on real Postgres
        if: matrix.suite == 'api'
        run: task be:test:postgres
        env:
          GRID_TEST_POSTGRES_REQUIRED: "1"

  # Records which test runs which code, for `backend-affected`. On every push
  # to develop, reused or not: a squash merge of a green pull request skips the
  # checks, and the database would otherwise stop following develop. Saved only
  # when every test passed, because testmon re-runs a recorded failure forever.
  # Not a check, so not in `CI OK` or `publish`: it holds nobody up.
  backend-testmon:
    name: Backend test database (testmon)
    needs: changes
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      qdrant:
        image: qdrant/qdrant:v1.19.2
        ports:
          - 6333:6333
    env:
      GRID_QDRANT_TEST_URL: http://localhost:6333
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-python-env
        with:
          python-version: "3.14"
      - uses: ./.github/actions/setup-task
      - run: task be:test:testmon
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .testmondata-*
          # Its own prefix: `testmon-` alone also matches a pull request's
          # `testmon-pr-…` entries, another suite's among them.
          key: testmon-develop-${{ github.sha }}

  # Everything on the UI's toolchain except the test shards. The production
  # build is NOT here: the frontend image build (`image`) runs the same
  # `bun run build` inside the Dockerfile whenever the UI's inputs change, so a
  # second build here only duplicated two minutes of work.
  #
  # Tenant isolation is the only check that proves row-level security holds
  # (ADR-0041): `tenant-isolation.integration.spec.ts` self-skips without a
  # database, so the unit shards are green whether the policies work or not.
  # It also runs the migrations as a non-superuser owner, which is what catches
  # a privilege mistake a superuser hides.
  frontend:
    name: Frontend (cards, lint, types, tenant isolation)
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # These jobs run PR-controlled code (`bun install` runs lifecycle scripts,
      # the suite runs the app), so no repository credential is left in
      # .git/config for them to find. Nothing here needs authenticated git.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Node is the RUNTIME (Turbopack's PostCSS step spawns a real `node`);
      # Bun is the toolchain: install, scripts, `bun check` (ADR-0103).
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - uses: ./.github/actions/setup-bun
      - uses: ./.github/actions/setup-task
      - run: task fe:install
      - run: task fe:cards:check
      # Findings become annotations on the pull request's diff.
      - run: task fe:lint -- --format=github
      - run: task fe:types
      # How many specs a change to each hub module selects, against its recorded
      # baseline: a new edge from a hub into a subtree fails here.
      - run: task fe:blast-radius
      # ubuntu-latest ships PostgreSQL server binaries but runs no cluster; the
      # script builds a throwaway one and tears it down.
      - name: Tenant isolation (row-level security, real Postgres)
        run: task db:test:rls
        env:
          # Turns "the suite skipped" into a failure for THIS step only: the
          # unit shards legitimately have no database.
          GRID_RLS_SUITE_REQUIRED: "1"
          # The per-migration checks only when a migration or the script moved.
          GRID_RLS_MIGRATION_CHECKS: ${{ needs.changes.outputs.migrations == 'true' && '1' || '0' }}

  frontend-test:
    name: Frontend tests (shard ${{ matrix.shard }}/8)
    needs: changes
    # A pull request whose change no UI spec reads since its reference (the
    # last green run or the base, ci/pr_selection.py) runs none ('none'); one that a selection can see runs only the specs
    # its change reaches ('select'); everything else, and every push, all.
    if: needs.changes.outputs.frontend == 'true' && (github.event_name == 'push' || needs.changes.outputs.ui_mode != 'none')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      # One shard's failure should not hide the others' results.
      fail-fast: false
      # Eight. The suite is mostly per-file startup (import and setup are ~60%
      # of a shard), so it scales with shards, and by 2026-10-19 four shards
      # took 7-11 minutes each against ~3:30 for a backend core shard. The
      # old reason for four, queued runner slots, did not hold up: job-level
      # queueing was under three seconds in every run measured then. Six
      # shards split by time (duration-sequencer.ts) all took 3.4-4.2 min on
      # 2026-10-22, the longest job of the run: with no shard left heavier
      # than the rest, only more of them shorten it.
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - uses: ./.github/actions/setup-bun
      - uses: ./.github/actions/setup-task
      - run: task fe:install
      - name: All specs, shard ${{ matrix.shard }}/8
        if: github.event_name == 'push' || needs.changes.outputs.ui_mode == 'full'
        # Coverage only where the comment is built from it.
        run: task fe:test:shard SHARD=${{ matrix.shard }}/8 COVERAGE=${{ github.event_name == 'pull_request' }}
      - name: The specs this change reaches, shard ${{ matrix.shard }}/8
        if: github.event_name == 'pull_request' && needs.changes.outputs.ui_mode == 'select'
        env:
          SHARD: ${{ matrix.shard }}/8
          FILES_JSON: ${{ needs.changes.outputs.ui_files }}
        run: task fe:test:related SHARD="$SHARD" FILES="$(jq -r 'join(" ")' <<<"$FILES_JSON")"
      # Coverage is collected per shard and merged below: a shard only loads
      # its own slice of the app. Uploaded even when the shard failed, because
      # the merged report is where a reviewer looks.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always() && github.event_name == 'pull_request' && needs.changes.outputs.ui_mode == 'full'
        with:
          name: vitest-blob-${{ matrix.shard }}
          path: frontends/ui/.vitest-reports
          include-hidden-files: true
          retention-days: 1

  # The coverage comment, and nothing else: correctness is gated by the shards.
  # Not in `CI OK`, so a slow merge never holds the gate open, and pull request
  # only, because on a push there is nobody to comment to.
  frontend-coverage:
    name: Frontend coverage
    needs: [changes, frontend-test]
    if: ${{ !cancelled() && github.event_name == 'pull_request' && needs.changes.outputs.frontend == 'true' && needs.changes.outputs.ui_mode == 'full' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write # coverage sticky comment
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - uses: ./.github/actions/setup-bun
      - uses: ./.github/actions/setup-task
      - run: task fe:install
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: vitest-blob-*
          merge-multiple: true
          path: frontends/ui/.vitest-reports
      - run: task fe:test:merge
      - name: Coverage comment (frontend)
        continue-on-error: true
        uses: davelosert/vitest-coverage-report-action@c4bbc33a89b7ace0e63d35f1f7d4bcee31155a73 # v2.13.0
        with:
          working-directory: frontends/ui

  site:
    name: Site (Astro check + build)
    needs: changes
    if: needs.changes.outputs.site == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - uses: ./.github/actions/setup-bun
      - uses: ./.github/actions/setup-task
      # Astro reprocesses every blog image on a cold cache. Keyed on the image
      # sources, with `restore-keys` turning a miss into a partial hit. Outside
      # node_modules, where a fresh install would delete it. The web image build
      # restores the same entry into its build context.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: apps/site/.astro-cache
          key: astro-cache-${{ runner.os }}-${{ hashFiles('apps/site/src/content/blog/_images/**', 'apps/site/src/assets/**') }}
          restore-keys: |
            astro-cache-${{ runner.os }}-
      - run: task site:verify

  infra:
    name: Infra (Pulumi typecheck + manifest tests)
    needs: changes
    if: needs.changes.outputs.infra == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - uses: ./.github/actions/setup-bun
      - uses: ./.github/actions/setup-task
      # The program and the policy pack, each from its own lockfile; a policy
      # rule that no longer compiles would otherwise surface only at deploy time.
      - run: task infra:install
      # What can run on an untrusted PR: the types (every CRD `spec`, and the
      # policy pack) and the manifests under `pulumi.runtime.setMocks` (a
      # renamed flag, a Service missing a port, a probe on the wrong endpoint).
      # `pulumi preview`, CRD schema validation and CrossGuard need stack
      # credentials and run in deploy.yml.
      - run: task infra:types
      # The collector build the image digest pins (`collectorImage` in
      # deploy/pulumi/src/config.ts): `collector-validate.spec.ts` runs every
      # rendered config through its `validate`, which is what refuses an
      # unknown component or key before the collector would at start. Bump the
      # version and checksum together with that digest.
      - name: Install otelcol-contrib (config validation)
        env:
          OTELCOL_VERSION: "0.163.2"
          OTELCOL_SHA256: "cc19dd6a1b85ca694ef16655688e597f693d0e24d2baecdd50e2db597819eeff"
        run: |
          curl -sSfL -o "$RUNNER_TEMP/otelcol.tar.gz" \
            "https://github.com/open-telemetry/opentelemetry-collector-releases/releases/download/v${OTELCOL_VERSION}/otelcol-contrib_${OTELCOL_VERSION}_linux_amd64.tar.gz"
          echo "${OTELCOL_SHA256}  $RUNNER_TEMP/otelcol.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/otelcol.tar.gz" -C "$RUNNER_TEMP" otelcol-contrib
          echo "OTELCOL_BIN=$RUNNER_TEMP/otelcol-contrib" >> "$GITHUB_ENV"
      - run: task infra:test

  # packages/ sits outside both workspaces (own bun.lock, own uv.lock),
  # so neither tier's install can run it. ~4 minutes, nearly all of it
  # ifc-spatial-py, which is why it is filtered at all.
  packages:
    name: Standalone packages (packages/)
    needs: changes
    if: needs.changes.outputs.packages == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - uses: ./.github/actions/setup-bun
      # Keyed on the package's OWN uv.lock: the root one would restore an
      # environment this suite never uses (IfcOpenShell + shapely wheels).
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
          cache-dependency-glob: packages/ifc-spatial-py/uv.lock
      - uses: ./.github/actions/setup-task
      - name: Install the packages' own toolchains
        run: task pkg:install
      # Two steps, not `task pkg:test`, so the summary names the package.
      - name: ifc-spatial (tests + typecheck)
        run: task pkg:test:ts
      - name: ifc-spatial-py (pytest)
        run: task pkg:test:py

  # The third-party images deploy/pulumi pins by digest (ADR-0029) are built by
  # nobody here, so nothing else scans them. Only the pins this change adds or
  # moves: an untouched pin with a CVE disclosed this morning is not this
  # change's to fix, and the weekly Security run scans every pin.
  trivy:
    name: Image vulns (trivy, changed pins)
    needs: changes
    if: needs.changes.outputs.pins != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TRIVY_VERSION: "0.61.1"
      PINS: ${{ needs.changes.outputs.pins }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: python3 -c 'import json, os; print("\n".join(json.loads(os.environ["PINS"])))' | tee pins.txt
      - name: Restore the layer analysis
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .trivy-cache/fanal
          key: trivy-layers-${{ env.TRIVY_VERSION }}-${{ hashFiles('pins.txt') }}
      - run: bash ci/trivy_scan.sh pins.txt
      - name: Save the layer analysis
        if: always() && hashFiles('.trivy-cache/fanal/**') != ''
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .trivy-cache/fanal
          key: trivy-layers-${{ env.TRIVY_VERSION }}-${{ hashFiles('pins.txt') }}

  # A pull request proves each image it changes still builds, and pushes
  # nothing: the token is read-only, so no build here can reach the registry
  # or the layer cache the next publish imports.
  image:
    name: Image build (${{ matrix.name }})
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.build != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: read # the GHCR layer cache
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.changes.outputs.build) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/build-image
        with:
          name: ${{ matrix.name }}
          context: ${{ matrix.context }}
          dockerfile: ${{ matrix.dockerfile }}
          target: ${{ matrix.target }}
          repository: ${{ matrix.repository }}
          hash: ${{ matrix.hash }}
          registry: ${{ env.REGISTRY }}

  # A push builds each image GHCR does not have yet and pushes it under its
  # content tag only. It runs beside the checks rather than after them: the
  # content tag claims nothing about the commit, so building early costs
  # nothing if a check later fails, and saves the build time when none does.
  image-push:
    name: Image build + push (${{ matrix.name }})
    needs: changes
    if: github.event_name == 'push' && needs.changes.outputs.build != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.changes.outputs.build) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/build-image
        with:
          name: ${{ matrix.name }}
          context: ${{ matrix.context }}
          dockerfile: ${{ matrix.dockerfile }}
          target: ${{ matrix.target }}
          repository: ${{ matrix.repository }}
          hash: ${{ matrix.hash }}
          registry: ${{ env.REGISTRY }}
          push: "true"
          # Source maps for PostHog error tracking. Only here, never in the pull
          # request `image` job above: a PR build must not write release data
          # into the PostHog project, and a fork has neither value. Both empty
          # (the secret/variable is not set up) builds exactly as before.
          # docs/contributing/ci.md#posthog-releases-and-source-maps
          posthog-api-key: ${{ secrets.POSTHOG_CLI_API_KEY }}
          posthog-project-id: ${{ vars.POSTHOG_PROJECT_ID }}

  # The commit's tags, `sha-<commit>` for all three images (and `latest` on
  # develop), go on only after every check on this push passed. That is the
  # contract deploy.yml and a prod promotion rely on: every commit CI passed
  # has all three images, and no commit CI failed has any.
  publish:
    name: Tag images for this commit
    needs: [changes, repo, backend, backend-coverage, backend-suites, frontend, frontend-test, site, infra, packages, trivy, image-push]
    if: >-
      always() && github.event_name == 'push' && needs.changes.result == 'success'
      && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          cleanup: false # the runner is discarded; see build-image/action.yml
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      # A registry-side manifest copy: seconds, and no layer moves.
      - name: Tag sha-${{ github.sha }}
        env:
          IMAGES: ${{ needs.changes.outputs.images }}
          LATEST: ${{ github.ref == 'refs/heads/develop' }}
        run: |
          python3 - <<'PY'
          import json, os, subprocess
          registry, sha = os.environ["REGISTRY"], os.environ["GITHUB_SHA"]
          for image in json.loads(os.environ["IMAGES"]):
              repo = f"{registry}/{image['repository']}"
              tags = ["-t", f"{repo}:sha-{sha}"]
              if os.environ["LATEST"] == "true":
                  tags += ["-t", f"{repo}:latest"]
              print(f"{repo}:inputs-{image['hash']} -> sha-{sha}", flush=True)
              subprocess.run(["docker", "buildx", "imagetools", "create", *tags, f"{repo}:inputs-{image['hash']}"], check=True)
          PY

  ci-ok:
    name: CI OK
    if: always()
    # `frontend-coverage` is deliberately NOT here: it produces a comment,
    # correctness is gated by the shards, and requiring it held the gate open
    # for a minute after the last shard.
    #
    # `retrieval-eval` used to be here. It read the real OIB Richtlinien, which
    # are now operator-provided and gitignored (data/oib/README.md), so no CI
    # checkout can hold a corpus to measure, and a job that can only pass
    # vacuously is worse than none. It survives as `task be:eval:retrieval`;
    # ADR-0058 "Update (2026-09-09)" says what restoring the gate would take.
    needs: [changes, repo, semgrep, backend, backend-coverage, backend-suites, backend-affected, frontend, frontend-test, site, infra, packages, trivy, image, image-push, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require needed jobs to have passed (skipped is fine)
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json, os, sys
          needs = json.loads(os.environ["NEEDS"])
          failed = {k: v["result"] for k, v in needs.items() if v["result"] not in ("success", "skipped")}
          if failed:
              sys.exit(f"Failing jobs: {failed}")
          print("All required jobs passed or were skipped.")
          PY
      # A green pull_request run leaves a marker named for the tree it tested
      # (GITHUB_SHA is the merge commit every job checked out), so the push
      # that lands this exact tree on a green parent can skip its checks. After
      # the check above and without always(), so a failing gate uploads nothing.
      # Best effort: a hiccup costs the push a full run, never this gate.
      - name: Name the tree this run tested
        id: tree
        if: github.event_name == 'pull_request'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tree="$(gh api "repos/$GITHUB_REPOSITORY/git/commits/$GITHUB_SHA" --jq .tree.sha)"
          [[ "$tree" =~ ^[0-9a-f]{40}$ ]]
          printf '%s\n' "$GITHUB_SHA" > "$RUNNER_TEMP/green-run.txt"
          echo "tree=$tree" >> "$GITHUB_OUTPUT"
      - name: Record this tree as green
        if: github.event_name == 'pull_request' && steps.tree.outputs.tree != ''
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-green-${{ steps.tree.outputs.tree }}
          path: ${{ runner.temp }}/green-run.txt
          retention-days: 7
          overwrite: true
