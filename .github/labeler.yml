# Path -> label rules for actions/labeler@v5 (see .github/workflows/pr.yml).
# Labels must exist in the repo (create them once under Issues -> Labels).

backend:
  - changed-files:
      - any-glob-to-any-file:
          - "packages/agent/**"
          - "apps/agent-host/**"
          - "packages/knowledge-layer/**"
          - "packages/ris-adapter/**"
          - "packages/tavily-web-search/**"
          - "evals/**"
          - "pyproject.toml"
          - "uv.lock"

frontend:
  - changed-files:
      - any-glob-to-any-file:
          - "apps/workspace/**"
          - "apps/site/**"

ci:
  - changed-files:
      - any-glob-to-any-file:
          - ".github/**"

docs:
  - changed-files:
      - any-glob-to-any-file:
          - "docs/**"
          - "**/*.md"

deploy:
  - changed-files:
      - any-glob-to-any-file:
          - "deploy/**"

database:
  - changed-files:
      - any-glob-to-any-file:
          - "**/migrations/**"
          - "**/db/schema/**"

tests:
  - changed-files:
      - any-glob-to-any-file:
          - "**/test_*.py"
          - "**/*.spec.ts"
          - "**/*.spec.tsx"
