[build-system]
build-backend = "setuptools.build_meta"
requires = ["setuptools>=84.2.1", "setuptools-scm>=10.3.4"]

[tool.setuptools]
packages = ["tavily_web_search"]
package-dir = {"tavily_web_search" = "src"}

[project]
name = "tavily-web-search"
version = "1.0.0"
description = "Web search for Piloti, through Tavily, for what the office's documents and the legal corpus do not hold"
readme = "README.md"
requires-python = ">=3.14,<3.15"
license = {text = "Apache-2.0"}
dependencies = [
    "httpx>=0.24.0",
    "pydantic>=2.0.0",
    "langchain-tavily>=0.1.0",
]

[project.entry-points."nat.plugins"]
tavily_web_search = "tavily_web_search.register"
