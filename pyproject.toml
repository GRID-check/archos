[build-system]
build-backend = "setuptools.build_meta"
requires = ["setuptools>=83.0.0", "setuptools-scm>=10.2.1"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.package-data]
"aiq_agent.agents.deep_researcher" = ["skills/**/*"]

[project]
name = "aiq-agent"
version = "2.0.0"
description = "Piloti, the workspace for architects: the agent, its tools and the knowledge it reads"
readme = "README.md"
# 3.14.1, not 3.14: uv lets a pre-release interpreter satisfy `>=3.14`, and on
# 3.14.0rc2 pydantic calls `typing._eval_type` with `prefer_fwd_module`, a
# keyword that landed after rc2, so every backend test died at import.
requires-python = ">=3.14.1,<3.15"
license = {text = "Apache-2.0"}
dependencies = [
    "nvidia-nat-core==1.9.0",
    "nvidia-nat[async-endpoints,phoenix,mcp]==1.9.0",
    # `[openai]` only: every LLM runs as `_type: openai`, and `[langchain]` on
    # the meta package is `[all]`, nine provider stacks we never import.
    "nvidia-nat-langchain[openai]==1.9.0",
    "nvidia-nat-eval==1.9.0",
    "nvidia-nat-profiler==1.9.0",
    # Exact: every 0.7 patch release changed a default, a tool's output or a
    # builder we call. Bump on purpose, then run tests/aiq_agent/test_deepagents_contract.py.
    # langchain-modal moves with it (0.0.7 needs deepagents>=0.7.32,<0.8).
    "deepagents==0.7.32",
    "langgraph-checkpoint-postgres>=3.0.0",
    "langgraph-checkpoint-sqlite>=2.0.0",
    "langchain-modal==0.0.7",
    "psycopg[binary]>=3.3.4",
    "asyncpg>=0.29.0",
    "redis>=5.0.0,<9",
    "aiosqlite>=0.19.0",
    "aiofiles>=23.0.0",
    "python-multipart>=0.0.27,<0.1",
    "knowledge-layer[all]",
    # Prompt management only (`common/prompt_store.py`): constructed with
    # `tracing_enabled=False`, so it never registers a tracer provider or hangs
    # a span processor on ours. Traces keep going out through NAT + the OTel
    # collector.
    "langfuse>=4.15.3,<5",
    # CVE version floors for transitive dependencies
    "cryptography>=50.0.0,<51",
    "pillow>=12.2.0,<14",
    "pygments>=2.20.0,<3",
    "a2ui-core==0.4.0",
    # Arrives through nvidia-nat-langchain[openai]; the floor is ours. Below 1.6.6 a
    # STREAMED Responses call drops the model's encrypted reasoning items, so
    # every tool round thinks from scratch and nothing fails
    # (docs/contributing/gotchas.md, a0ec99d2).
    "langchain-openai>=1.6.6",
    # 7.59 reads POSTHOG_RELEASE_ID, which links an exception to its release.
    "posthog>=7.59,<8",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "pytest-env>=1.1.0",
    "pre-commit>=3.5.0",
    "ruff~=0.17.0",
    "yapf>=0.40.0",
    "mypy>=2.3.0",
    "fakeredis[lua]>=2.20.0",
]
docs = [
    "sphinx>=7.0",
    "myst-parser>=3.0",
    "sphinx-copybutton>=0.5",
    "sphinx-mermaid>=0.0.8",
    "sphinx-rtd-theme>=2.0",
    "sphinx-autobuild>=2025.8.25",
    "nvidia-sphinx-theme>=0.0.9.post1",
    "sphinx-design>=0.7.0",
    "sphinxcontrib-mermaid>=2.0.3",
]
viz = [
    "pygraphviz>=2.0",
]

# -----------------------------------------------------------------------------
# Workspace members are installed via: uv sync
# Individual packages: uv pip install -e ./frontends/aiq_api
# See [tool.uv.workspace] below for auto-discovered packages
# -----------------------------------------------------------------------------

[project.entry-points."nat.plugins"]
# `aiq_researcher*` and not `aiq_piloti*` although the package moved to
# `agents/piloti`: a plugin entry-point name is what a deployment's
# `NAT_PLUGIN_*` allow/deny lists and the installed dist-info carry, and a
# stale `<pkg>.egg-info/entry_points.txt` from an older checkout is exactly the
# ModuleNotFoundError-from-nowhere in `docs/contributing/gotchas.md`. Only the
# module paths move.
aiq_researcher_conversation = "aiq_agent.agents.piloti.conversation_register"
aiq_researcher = "aiq_agent.agents.piloti.register"
aiq_deep_researcher = "aiq_agent.agents.deep_researcher.register"
aiq_data_source_registry = "aiq_agent.common.data_source_registry"
aiq_project_memory = "aiq_agent.memory.register"
aiq_cards = "aiq_agent.cards.register"
aiq_bim = "aiq_agent.tools.bim.register"
# The spatial half of the BIM surface (`ifc_measure`). A second entry point
# rather than an import from `register`: NAT discovers plugins by loading the
# module a plugin names, so the fast metadata tool and the geometry tool stay
# independently loadable — and `ifc_query` keeps working on a deployment where
# the spatial engine (ifcopenshell, shapely) is not installed at all.
aiq_bim_measure = "aiq_agent.tools.bim.measure_register"
# The write-side workspace tool, `propose_file_change` (move, rename,
# create_folder, assign as one `operation` argument).
aiq_files = "aiq_agent.tools.files.register"
# The working directory's door into the project (`file_draft`, which files a
# draft and, with `submit`, sends it for review). Its OTHER four verbs are stock
# DeepAgents tools bound directly by Piloti's register and are not NAT
# functions at all, so this entry point covers exactly the one that calls the BFF.
aiq_documents = "aiq_agent.tools.documents.register"
# Delegation (`create_task`). Its own entry point rather than a member of
# `aiq_documents`: the two call different BFF routes with different contracts,
# and a deployment that turns one off must be able to keep the other.
aiq_tasks = "aiq_agent.tools.tasks.register"
# Cross-project lookups for a chat, shared or solo (`project_lookup`, ADR-0094). Its own
# entry point: it imports the knowledge layer's lane fan-out lazily, and a
# deployment without the lookups must keep every other tool.
aiq_cross_project = "aiq_agent.tools.cross_project.register"
# The review canvas (`canvas` function group, `tools/canvas`): see who is in the
# document, point and highlight, read and propose Anmerkungen, set, change or
# delete one when the person asks, answer in a thread. Its own entry point: it
# calls its own BFF route, and a deployment without it keeps every other tool.
aiq_canvas = "aiq_agent.tools.canvas.register"
# `look` (`tools/look`, ADR-0128): a page, a region of it or an embedded image,
# as an image the model sees, in every context. Its own entry point, not a
# member of the canvas group: a deployment without one keeps the other.
aiq_look = "aiq_agent.tools.look.register"
# `show_in_viewer` (`tools/viewer`, ADR-0144): Piloti proposes to move the asker's
# own document viewer, one allow-listed action as an AG-UI frontend tool call.
# Its own entry point: it reuses `look`'s resolver, and a deployment can drop it alone.
aiq_viewer = "aiq_agent.tools.viewer.register"
# Piloti as a client of its own MCP server (`workspace` function group,
# `tools/workspace`, ADR-0122): search, describe and call the operations a person
# can do in the product. Its own entry point: it calls the BFF's `/api/mcp`, and a
# deployment without it keeps every other tool.
aiq_workspace = "aiq_agent.tools.workspace.register"
# The Erfassungs-Agent's config (`_type: project_intake_agent`, ADR-0111). The
# research worker reads it by name and runs the agent; NAT only has to know the
# type, or `load_config` refuses the YAML that names it.
aiq_project_intake = "aiq_agent.agents.intake.register"
# Grid telemetry `_type`s named in the shipped YAML. They register at import
# via NAT decorators and used to ride in on `chat_researcher.register`. After
# that package dissolved, `load_config` in a clean interpreter (the container's
# `start_web.py`) raised ValidationError and the pod CrashLoopBackOff'd.
# Discovery loads `nat.plugins`; without these they do not exist at runtime.
# The RIS chat surface (`ris_lookup`). The three older RIS tools ride in on
# `ris-adapter`'s own entry point (`packages/ris-adapter/pyproject.toml`); this
# one is separate because `ris_adapter.lookup` hard-imports the knowledge layer
# for the passage bound and the lane fan-out, and a deployment without it must
# lose this tool alone rather than `ris_search` and `ris_fetch_document` with
# it — the `aiq_bim_measure` split, for the same reason.
aiq_ris_lookup = "ris_adapter.lookup"
aiq_otel_logs = "aiq_agent.observability.otlp_logging_method"
aiq_otel_redaction = "aiq_agent.observability.otel_header_redaction_exporter"

[tool.pytest.ini_options]
testpaths = [
    "tests",
    "evals",
    "packages/knowledge-layer/tests",
    "packages/ris-adapter/tests",
    "packages/tavily-web-search/tests",
]
# `-m "not live"`: a test that calls a real model runs only when asked for by
# name (`task be:eval:turn-shapes` passes `-m live`, and a later `-m` replaces
# this one). A key that happens to be in the shell is not that request: before
# this, `task verify` spent model tokens on any machine that had one.
addopts = "--import-mode=importlib -m 'not live'"
# Makes `from tests.provider_doubles import ...` (the shared provider-contract double)
# resolve the same way under every invocation — `python -m pytest`, the bare
# `pytest` console script, and an IDE runner — instead of
# depending on which of those happens to put the repo root on sys.path.
#
# `src` is the same guard for `aiq_agent`. The venv installs it editable from
# whichever checkout ran `uv sync`, so a bare `pytest` in a worktree without its
# own venv tested the MAIN checkout's code while everything passed. This puts
# the checkout's own `src/` ahead of that install (the editable `.pth` is
# appended to sys.path, so it loses). `frontends/aiq_api/src` is the same guard
# for `aiq_api`, which `tests/aiq_agent` imports too (the worker's header
# contract, the job runner): without it a root-level `pytest` in a worktree ran
# those tests against the MAIN checkout's `aiq_api`. `evals/oib-retrieval/src`
# is the same guard for the retrieval harness, a finder-style editable the evals
# import by name. `knowledge_layer` is a finder-style editable too and is NOT
# covered by this; see docs/contributing/gotchas.md.
# The test-support packages come last: `<distribution>_testing`, one per suite
# family, so a suite imports its helpers by a name that no directory move changes
# (ADR-0145 row 5; tests/test_test_imports.py holds it).
pythonpath = [".", "src", "frontends/aiq_api/src", "evals/oib-retrieval/src", "packages/knowledge-layer/testing", "packages/ris-adapter/testing", "tests/aiq_agent/testing"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
markers = [
  # Calls a real model through OpenRouter. Deselected by `addopts` above, which
  # is how the default run, `task verify` and every PR job stay model-free
  # whatever the shell holds; selected with `-m live`, and then each such test
  # still skips itself without OPENROUTER_API_KEY.
  # `.github/workflows/turn-shapes-live.yml` runs them with the key.
  "live: needs a real model behind OPENROUTER_API_KEY; deselected unless -m live",
]


[tool.ruff]
# Set the maximum line length to 120.
line-length = 120
# No target-version: ruff reads it from `requires-python` above, so the two
# cannot drift apart again (it said py311 while the project required 3.14).
#
# Except what runs outside the project venv, on the runner's own `python3`
# (3.12 on ubuntu-24.04) or `uv run --no-project`: CI's scripts, the hook
# checkers, the release-note tool and the Chroma exporter (`uvx --python 3.12`).
# On py314 the formatter writes `except A, B:` (PEP 758), a SyntaxError there.
[tool.ruff.per-file-target-version]
"ci/**/*.py" = "py312"
"scripts/check_*.py" = "py312"
"scripts/release_notes.py" = "py312"
"deploy/migration/**/*.py" = "py312"

[tool.ruff.lint]

select = [
  # The E, F, W categories are flake8 rules.
  "E",
  "F",
  "W",
  # Enable isort support
  "I",
  # Enable partial pylint support
  "PL",
  # Enable pyupgrade support
  "UP",
  # banned-api: NAT internals that `nat.plugin_api` re-exports (below)
  "TID251",
]

extend-ignore = [
  "PLC0415", # Allow lazy imports inside functions
  # Disable all the "too-*" checks, as they are too strict for our codebase
  "PLR0904", # too-many-public-methods
  "PLR0911", # too-many-return-statements
  "PLR0912", # too-many-branches
  "PLR0913", # too-many-arguments
  "PLR0914", # too-many-locals
  "PLR0915", # too-many-statements
  "PLR0917", # too-many-positional-arguments
  "PLR1702", # too-many-nested-blocks
  "PLR2004", # Magic value used in comparison this happens a lot within unittests
  "PLW0108", # unnecessary-lambda
  "PLW2901", # allow re-assigning a loop variable
  "PLW0603",
  "PLE1205"
]

# NAT's stable plugin surface is `nat.plugin_api` (1.9, ADR-0068). These are the
# internal modules it re-exports from. A name `plugin_api` does not export may
# still come from here, with `# noqa: TID251` saying it is internal.
[tool.ruff.lint.flake8-tidy-imports.banned-api]
"nat.builder.builder".msg = "Import from nat.plugin_api"
"nat.builder.context".msg = "Import from nat.plugin_api"
"nat.builder.evaluator".msg = "Import from nat.plugin_api"
"nat.builder.framework_enum".msg = "Import from nat.plugin_api"
"nat.builder.function".msg = "Import from nat.plugin_api"
"nat.builder.function_info".msg = "Import from nat.plugin_api"
"nat.cli.register_workflow".msg = "Import from nat.plugin_api"
"nat.data_models.component_ref".msg = "Import from nat.plugin_api"
"nat.data_models.evaluator".msg = "Import from nat.plugin_api"
"nat.data_models.function".msg = "Import from nat.plugin_api"
"nat.data_models.interactive".msg = "Import from nat.plugin_api"
# NAT's socket and HTTP frame models. The chat wire is `aiq_agent.common.wire_v2`
# (ADR-0068); nothing here reads or writes a NAT frame.
"nat.data_models.api_server".msg = "The chat wire is aiq_agent.common.wire_v2 (ADR-0068), not NAT's frame models"

# Notebooks: allow long lines (shell/code) and imports after other statements
[tool.ruff.lint.per-file-ignores]
"docs/notebooks/*.ipynb" = ["E501", "E402"]

[tool.ruff.lint.isort]
combine-as-imports = true
default-section = "third-party"
force-single-line = true
known-first-party = ["aiq", "aiq_api", "nat", "nat_*", "_utils"]
known-third-party = [
  "agno",
  "autogen",
  "crewai",
  "google",
  "langchain",
  "llama_index",
  "mem0ai",
  "redis",
  "semantic_kernel",
  "zep_cloud",
]
order-by-type = true

# The seams between the three Python packages, checked by import-linter in
# `task be:lint` (`lint-imports`). It reads the import graph through grimp, lazy
# imports inside functions included. An `ignore_imports` entry whose import is
# gone fails the run (import-linter's default), so these lists only shrink.
# docs/contributing/module-seams.md
[tool.importlinter]
root_packages = ["aiq_agent", "aiq_api", "knowledge_layer"]
# Third-party packages become nodes too, so a contract can name one.
include_external_packages = true

[[tool.importlinter.contracts]]
id = "qdrant-client-confined"
name = "Only knowledge_layer.qdrant imports qdrant_client"
type = "forbidden"
source_modules = ["aiq_agent", "aiq_api", "knowledge_layer"]
forbidden_modules = ["qdrant_client"]
# Who names the client, not who reaches a module that does: everything reaches
# knowledge_layer.qdrant, which is the point of confining the client there.
allow_indirect_imports = true
ignore_imports = ["knowledge_layer.qdrant.** -> qdrant_client"]

[[tool.importlinter.contracts]]
id = "agent-api-seam"
name = "aiq_agent never imports aiq_api: the API tier hosts the agent, not the reverse"
type = "forbidden"
source_modules = ["aiq_agent"]
forbidden_modules = ["aiq_api"]

[[tool.importlinter.contracts]]
id = "agent-knowledge-port"
name = "aiq_agent reaches knowledge_layer only through the retriever and ingestor port (ADR-0072)"
type = "forbidden"
source_modules = ["aiq_agent"]
forbidden_modules = ["knowledge_layer"]
# Direct imports only: aiq_agent reaching knowledge_layer through aiq_api is the
# API tier's business, and the agent-api-seam contract already bounds that edge.
allow_indirect_imports = true
ignore_imports = [
  # The port: `aiq_agent.knowledge.factory` builds the BaseRetriever and
  # BaseIngestor the agent talks to, so it is the one module that should.
  "aiq_agent.knowledge.factory -> knowledge_layer.**",
  # Known bypasses of the port, from before this contract. Route each one
  # through the port and delete its line; a new one fails the build.
  "aiq_agent.agents.piloti.register -> knowledge_layer.chat_binding",
  "aiq_agent.agents.piloti.register -> knowledge_layer.estate",
  "aiq_agent.knowledge.collection_pages -> knowledge_layer.chunk_positions",
  "aiq_agent.knowledge.collection_pages -> knowledge_layer.qdrant.payload",
  "aiq_agent.knowledge.collection_pages -> knowledge_layer.qdrant.reads",
  "aiq_agent.knowledge.folder_cards.inputs -> knowledge_layer.browse",
  "aiq_agent.knowledge.folder_cards.worker -> knowledge_layer.browse",
  "aiq_agent.knowledge.folder_cards.worker -> knowledge_layer.qdrant.folders",
  "aiq_agent.knowledge.folder_cards.worker -> knowledge_layer.qdrant.store",
  "aiq_agent.knowledge.scoping -> knowledge_layer.search_scope",
  "aiq_agent.oib_sync -> knowledge_layer.llamaindex.adapter",
  "aiq_agent.tools.cross_project.hit_judge -> knowledge_layer.decisions",
  "aiq_agent.tools.cross_project.register -> knowledge_layer.trace_lanes",
  "aiq_agent.tools.look.reading -> knowledge_layer.llamaindex.adapter",
  "aiq_agent.tools.look.register -> knowledge_layer.view_image",
  "aiq_agent.tools.look.resolve -> knowledge_layer.view_image",
]

[tool.yapf]
based_on_style = "pep8"
column_limit = 120
split_all_top_level_comma_separated_values = true
join_multiple_lines = true
indent_dictionary_value = true

# -----------------------------------------------------------------------------
# uv Workspace Configuration
# The Python packages under packages/ and the backend plugin under frontends/
#
# Usage:
#   uv sync                              # Install root + all workspace members
#   uv sync --package aiq-agent  # Install only the root package
#   uv pip install -e ./packages/ris-adapter  # Install a specific package
#   uv pip install -e "./frontends/aiq_api[postgres]"  # With extras
# -----------------------------------------------------------------------------
[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "pytest-env>=1.1.0",
    "pre-commit>=3.5.0",
    "ruff~=0.17.0",
    "yapf>=0.40.0",
    "mypy>=2.3.0",
    "fakeredis[lua]>=2.20.0",
    # Workspace packages for testing
    "tavily-web-search",
    "ris-adapter",
    "knowledge-layer[all]",
    "aiq-api",
    # The eval harness (evals/), so its tests and `task be:eval:*` import it
    # by name. Path sources, not workspace members: the backend image's
    # `uv sync --all-packages` would otherwise need evals/ in its build context.
    "oib-retrieval",
    "pytest-xdist>=3.8.0",
    # Splits the core suite across CI's backend shards (ci.yml `backend`).
    "pytest-split>=0.11.0",
    # Runs only the tests a pull request's change reaches (ci.yml `backend-affected`).
    "pytest-testmon>=2.2.0",
    "import-linter>=2.15",
]

[tool.uv]
prerelease = "if-necessary-or-explicit"
override-dependencies = [
    "authlib>=1.6.11,<2",
    "cryptography>=50.0.0,<51",
    "pillow>=12.2.0,<14",
    "pygments>=2.20.0,<3",
    "pyopenssl>=26.0.0,<27",
    "tornado>=6.5.9",
    "banks>=2.4.2,<3",
    "lxml>=6.1.0,<7",
    "nltk>=3.9.4,<4",
    "pyasn1>=0.6.3,<0.7",
    "anyio>=4.14.2",
    "urllib3>=2.8.0",
    "virtualenv>=21.7.13",
    "langgraph-sdk>=0.4.4",
    "fsspec>=2026.6.0",
]

[tool.uv.pip]
prerelease = "if-necessary-or-explicit"

[tool.uv.workspace]
members = [
    # Explicit, not packages/*: ifc-spatial-py keeps its own uv.lock so that
    # IfcOpenShell stays out of this one (packages/AGENTS.md), and ifc-spatial
    # and brand are not Python. tests/test_python_packages.py holds this list,
    # pytest's testpaths and the Taskfile's PY_PACKAGES to one another.
    "packages/knowledge-layer",
    "packages/ris-adapter",
    "packages/tavily-web-search",
    "frontends/aiq_api",
]

[tool.uv.sources]
aiq-agent = { workspace = true }
tavily-web-search = { workspace = true }
ris-adapter = { workspace = true }
knowledge-layer = { workspace = true }
aiq-api = { workspace = true }
oib-retrieval = { path = "evals/oib-retrieval", editable = true }
