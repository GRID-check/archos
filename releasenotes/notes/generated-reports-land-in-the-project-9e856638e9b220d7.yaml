---
features:
  - >
    A filter beside „Alle · Meine · Unvergeben" shows only what Piloti wrote, so
    a project's generated reports are one click away however they were filed.
  - >
    A finished Recherchebericht now lands in your project instead of only in the
    chat. You will find it under „Berichte", where you can open it, preview it,
    download it and delete it like any other file — and share it with the people
    on the project without copying anything out.
  - >
    A report arrives „Unvergeben“, so it belongs to nobody until someone
    takes it on. Assigning it to yourself makes it your work, and the check
    you already run before an Einreichung also finds any report nobody has
    claimed.
  - >
    The banner names where a report will be filed while the research is
    starting, when you can still stop it, and links to the finished file with
    „Im Projekt öffnen“. If nothing could be filed, it promises nothing.
  - >
    Every file Piloti writes says so. In the app it carries the line „Von Piloti
    erstellt", and the Word export opens with „KI-generiert — nicht geprüft", so
    a document that leaves your hands still says what it is.
upgrade:
  - >
    Only runs you start yourself file a report at the moment. Scheduled runs
    still deliver into their conversation and will follow later.
  - >
    Reports from runs finished before this change stay where they were, in their
    conversation. Nothing was filed retroactively.
other:
  - >
    Piloti does not use its own reports as sources, so an answer never cites
    a Piloti report as if it were a document you supplied. To use a report
    in later answers, upload it yourself once you have checked it.
