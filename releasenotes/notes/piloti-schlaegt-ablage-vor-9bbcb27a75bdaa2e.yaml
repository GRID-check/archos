---
features:
  - >
    Piloti can now help tidy the project files. Ask it to move something into a
    folder, rename a file, create a folder or hand a document to a colleague,
    and it puts the change on a card beside the answer for you to apply or
    discard.
  - >
    A request that touches several files at once — putting the submission
    documents together, for instance — arrives as one card listing every move,
    so it is one decision rather than one per file.
improvements:
  - >
    Nothing is changed until you press Apply, and the change then runs as
    you, with your own permissions. A change is shown as done only once it
    has been carried out.
  - >
    If part of a set of changes cannot be applied, for example because a
    file has already been moved or a colleague has left the project, the
    card shows which entries were not carried out instead of reporting
    everything as done.
