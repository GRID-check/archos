---
features:
  - >
    A U-value, the Schrittmaßregel, an escape route's length or a room's glazing
    share now comes as a „Was wäre, wenn“ card, held to the Richtlinie's limit for
    your stair type, component or room. Change an input and the result and the
    verdict are recomputed on the spot; your value is marked „Ihre Annahme“ beside
    the source's figure, and nothing is saved.
