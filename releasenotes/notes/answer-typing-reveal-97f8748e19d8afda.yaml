---
improvements:
  - >
    Answers now appear as they are written, line by line, instead of landing
    on the page in one block. The pace follows the length of the answer, so
    long answers do not drag, and the effect steps aside for anyone whose
    system asks for reduced motion.
fixes:
  - >
    An answer can again show more than one card. On questions that needed real
    research, the second card used to be dropped, however well it fitted the
    answer.
