---
fixes:
  - >
    A Viewer who opens a project's chat now sees the message box locked, with
    the reason, instead of typing a question that fails when sent. The member
    list shows the role each person really holds, instead of rounding narrower
    roles down to "Viewer".
  - >
    A project whose creation failed partway through is no longer left
    unreachable for the person who created it.
  - >
    Access to every project in your organization now comes with the
    administrator role itself, not with a role named Admin. A custom
    administrator role reaches projects like the built-in one.
  - >
    Project admins can create and run scheduled skills again. Only
    organization admins could do so after a permission was renamed.
security:
  - >
    Project roles now mean what the access reference says: the Contributor role
    can be assigned and may use Piloti in the project. A Viewer reads documents
    and conversations but can no longer start research.
operators:
  - >
    Platform Support also works while viewing a tenant organization, which it
    previously could not.
  - >
    Read-only platform staff are now read-only: each platform screen requires
    its own permission, so Platform Support can see every screen and change
    none.
