---
features:
  - >
    Letting Piloti file the documents it writes into a project is now a
    permission of its own. Members without it can still upload, rename and
    delete their own files.
upgrade:
  - >
    The built-in Project Editor and Project Admin roles receive the new filing
    permission. Grant it to a custom project role yourself, or leave it out if
    Piloti should only answer.
