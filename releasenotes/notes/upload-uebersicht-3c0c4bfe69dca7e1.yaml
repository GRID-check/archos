---
features:
  - >
    The upload summary now shows which files were a new version of a document
    already there (Geändert), and which went into a folder with its own access
    list (Geschützt). It counts both and marks each such file.
  - >
    The upload history in the project settings now reaches back to the project's
    first upload. With „Ältere Uploads laden“, you see the next older ones.
fixes:
  - >
    Files uploaded in the project wizard now get the same inbox notice and
    upload summary as any other upload, and appear in the project's upload
    history.
security:
  - >
    If a folder of the project is closed to you, the upload history in the
    project settings counts only the files that landed in folders you can open,
    and no longer lists an upload with none there. A folder in the Papierkorb
    that you could open, and a folder whose files were deleted for good, do not
    count as closed to you.
