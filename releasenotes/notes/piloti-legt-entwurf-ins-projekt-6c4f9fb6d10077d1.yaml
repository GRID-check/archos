---
features:
  - >
    A draft Piloti wrote can now be put into the project. Ask for it with “leg
    das ins Projekt” or “ablegen”, and the document appears in Files, marked
    as a draft, with the card beside the answer linking straight to it.
  - >
    Asking a second time updates the same document instead of leaving a second
    copy beside the first, so a conversation that revises an Aktenvermerk three
    times ends with one file and its history rather than three files.
  - >
    A filed draft can be sent for review, from the card or by asking Piloti,
    and it then appears in the reviewer's inbox. Approving, publishing and
    archiving stay with people: Piloti can send a draft for review, but it
    cannot approve, publish or archive it.
improvements:
  - >
    Nothing Piloti files is approved or searchable at first. It arrives as a
    draft and says so on the card and in the answer, and it becomes searchable
    only after someone approves and publishes it.
  - >
    Filing happens under your own name and your own permissions. Piloti files
    as the person who asked, so a document it puts into a project is one you
    could have put there yourself, and the history says who asked for it.
