---
features:
  - >
    You can mention a colleague in an Anmerkung the way you mention someone in
    the chat: type „@“ in a new Anmerkung or in its thread and pick the person,
    whose name then shows as the chat's chip. They find it in their Postfach,
    where the quote shows the names as the same chips, and as a notification
    on their devices, which opens the Prüfansicht right
    at that Anmerkung, and they can answer from there.
  - >
    The „@“ list offers only people who can open the document, and if someone
    cannot, the reply box says they were not told.
