---
improvements:
  - >
    Piloti now picks where to look based on your question rather than
    following a fixed order, so a question about the Bauordnung goes straight
    to the Bauordnung. Values in an answer are taken from passages Piloti read
    for that answer, and a reference that still fails the check is marked.
  - >
    A question that touches the Richtlinien, the RIS and the web now checks all
    three in its first round instead of saving one for later.
  - >
    An answer with a card now takes one step less.
