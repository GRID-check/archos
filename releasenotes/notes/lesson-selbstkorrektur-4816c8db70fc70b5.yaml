---
improvements:
  - >
    Project memory now takes your feedback into account: when a thumbs-down
    comment is close in meaning to a stored note, that note is marked with low
    confidence in your project. Nothing is deleted, and pinned notes are exempt.
  - >
    Uploading a document again under the same name now replaces its earlier
    version in search, instead of competing with it, so answers draw on the new
    upload. A document under a new name is still a new document: deciding that
    one file replaces a differently named one stays with a person.
operators:
  - >
    Lessons learned from feedback now watch themselves: a lesson that keeps
    collecting reports is flagged as not working, and one whose cause was fixed
    retires after two weeks without a recurrence. Both steps are in the lesson's
    audit trail and reversible from Platform → Lessons.
