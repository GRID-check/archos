---
fixes:
  - >
    A filed Recherchebericht now always lands in the project its research
    was run for. Before, a report from a run started outside a project, or
    from an older run reopened while another project was open, could end up
    in the wrong project, with that project's Bundesland on its cover sheet.
  - >
    Files Piloti writes now get clean names that you can find again later. A
    report on „Fluchtweglängen Gebäudeklasse 4“ is saved as
    fluchtweglaengen-gebaeudeklasse-4, and a client name with a Polish or
    Czech letter keeps every letter.
  - >
    A report Piloti wrote can no longer be mistaken for one of your own
    documents when the two happen to share a name. Search results, file
    summaries, tags, page details and renaming now always act on the document
    you actually opened, and deleting a report can no longer take the
    corresponding Gutachten out of what Piloti can cite.
  - >
    Opening a file on a phone shows its name again. In the file preview, long
    filenames and the „Von Piloti erstellt" line were being squeezed out by the
    row of buttons beside them.
