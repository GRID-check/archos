---
features:
  - >
    Answers now open with a clear heading whatever the question: overviews
    get a title and a line on their scope, legal rulings keep their verdict
    header, and answers about one provision quote the decisive passage right
    beneath it.
  - >
    Drafts Piloti writes can now be opened and read straight from the chat,
    before anything is filed into the project.
improvements:
  - >
    Overviews carry a summary and the key points again, and follow-up
    suggestions come from the actual gaps in the answer.
  - >
    The Herleitung names what was actually searched instead of calling every
    search OIB knowledge.
fixes:
  - >
    Piloti no longer repeats a Richtlinie search when it has already looked
    through the whole family, and a follow-up request for a file no longer
    makes Piloti question you about the format.
  - >
    Long text documents now scroll correctly in the side preview.
