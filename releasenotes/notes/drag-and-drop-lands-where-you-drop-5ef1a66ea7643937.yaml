---
improvements:
  - >
    Files dragged from your desktop onto a folder, or onto a folder in the path
    above the list, now upload into that folder, and the drop area names it
    before you let go.
fixes:
  - >
    A second drop while an upload is still running now waits its turn instead
    of disappearing, and the drop area no longer stays on screen after a
    cancelled drag.
  - >
    A folder you may only read now says so when you drag files over it, and its
    files can no longer be dragged out, instead of the move failing afterwards.
