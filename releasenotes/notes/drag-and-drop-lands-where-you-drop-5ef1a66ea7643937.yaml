---
features:
  - >
    Hold a file or folder you are dragging over a folder for a moment and it
    opens, so you can move things into folders that are not on screen. Every
    move now offers to undo it.
improvements:
  - >
    Files dragged from your desktop onto a folder, or onto a folder in the path
    above the list, now upload into that folder, and the drop area names it
    before you let go.
fixes:
  - >
    A second drop while an upload is still running now waits its turn instead
    of disappearing, and the drop area no longer stays on screen after a
    cancelled drag.
  - >
    A folder you may only read now says so when you drag files or documents
    over it, and its files can no longer be dragged out.
  - >
    Moving or renaming a folder to a name that is already taken there now says
    which name is in the way, instead of failing without a reason.
