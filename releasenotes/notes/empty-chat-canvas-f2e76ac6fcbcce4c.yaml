---
improvements:
  - >
    A new chat now opens with the greeting and the input box together in the
    middle of the screen, instead of the greeting floating high and the input
    pinned to the bottom edge. As soon as you ask something, the input returns
    to the bottom and the answer gets the full height.
  - >
    An empty chat no longer shows example questions or explains that answers
    cite their sources, and the message field no longer says that a plain
    message goes to Piloti. Mentioning a colleague works as before, and the
    field still names the recipient whenever it is not Piloti, such as when you
    have tagged someone or the chat is waiting for a person.
