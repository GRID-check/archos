---
features:
  - >
    You can now upload Excel workbooks, PowerPoint presentations, CSV files and
    WebP images. Answers cite the right sheet or slide rather than just the
    file.
improvements:
  - >
    Piloti reads drawings more precisely: each drawing on a sheet, such as a
    floor plan, a section or a detail, keeps its own scale, rooms, structure and
    build-ups. Where a reading of the image is uncertain, Piloti marks it as
    such.
  - >
    Drawings uploaded as images get the same structured reading as drawings in a
    PDF, and a file's detail view shows what Piloti recognised on each drawing.
fixes:
  - >
    Piloti now reads Word documents correctly, so answers can cite them. Before,
    they were accepted on upload and then marked as failed.
