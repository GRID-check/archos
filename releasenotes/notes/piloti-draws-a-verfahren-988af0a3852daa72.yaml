---
features:
  - >
    Piloti can now draw a procedure. Where an answer turns on a sequence that
    text cannot convey well, such as who hands what to whom, it returns a
    drawing beside the text, and one click files that drawing into the project
    as a drawing file and a PDF you can attach to an Einreichung (submission).
  - >
    A section, a staircase, an escape route or a distance is drawn from the
    values Piloti reads, so the drawing and the numbers come from one source.
