---
features:
  - >
    Piloti can now draw a procedure. Where an answer turns on a sequence that
    a paragraph cannot hold, such as who hands what to whom, it returns a
    drawing beside the text, and one click files that drawing into the project
    as an SVG and a PDF you can attach to an Einreichung.
  - >
    Drawings never carry a measurement. A section, a staircase, an escape
    route or a distance still comes back as one of the fifteen technical
    schematics, where Piloti supplies the values and computes the drawing from
    them, so the picture cannot disagree with its own numbers.
