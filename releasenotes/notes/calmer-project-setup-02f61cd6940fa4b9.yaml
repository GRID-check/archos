---
features:
  - >
    Creating a project asks only for its name, address, a line about it and
    whether it is running or finished. The setup that follows takes the
    documents, the questions they leave open and the profile in three steps,
    and works without any documents too.
  - >
    The Projekterfassung no longer asks you to confirm every value one by
    one. Values that decide the Gebäudeklasse are confirmed individually;
    everything else is taken in one go, after you discard anything wrong.
fixes:
  - >
    With no project yet, the projects page shows one button to create the
    first project instead of two.
  - >
    The address in the new-project dialog keeps what you type. Before, it
    turned into a Bundesland list after three letters and dropped the text.
  - >
    A folder dropped on the new-project dialog now lands only in the project
    it was dropped for. Before, if its setup page did not take it, the next new
    project could.
