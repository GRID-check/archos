---
features:
  - >
    Comparing two versions now shows what changed, line by line: added lines
    carry a plus and a solid rule, removed lines a minus and a dashed rule.
    Long unchanged stretches collapse into a gap that shows how many lines
    it hides.
improvements:
  - >
    Two identical versions are reported in a sentence instead of an empty list,
    and the comparison uses marks and strokes rather than red and green, which
    in Piloti mean where something comes from.
  - >
    When something fails, the error message now carries a short reference for
    support that you can copy with one click.
fixes:
  - >
    A member budget can no longer be set for someone who does not belong to the
    organization; such a limit used to be saved and never applied.
