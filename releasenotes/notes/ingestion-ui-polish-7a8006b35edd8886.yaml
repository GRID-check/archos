# One entry per user-visible change. This text is PUBLISHED, in English and in
# German machine translation, to https://piloti.at/changelog — write it for the
# architect using Piloti, not for the reviewer of your diff.
improvements:
  - >
    While files upload and Piloti reads them, every status now has its own
    symbol, so a document that is waiting, being read, held back for review or
    filed unread is told apart at a glance in the upload panel, on the cards
    and in the list. A document that could not be read is marked in a calmer
    red, and shortened file names always show where they were cut.
