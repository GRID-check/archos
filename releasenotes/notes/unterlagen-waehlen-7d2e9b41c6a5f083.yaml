---
features:
  - >
    In the research plan you choose under Documents which documents from the
    project and Office filing the research reads in full and which it does not
    use. Excluded documents are not cited, even when a search finds them.
  - >
    While a run is going, „Dokument hinzufügen“ adds another document, and
    the block shows whether each named document was read. A report names any
    document it did not reach.
  - >
    A results table in a comparison or file note is headed „Ergebnisse“, not
    „Befunde“, and does not give a verdict that the report did not reach.
