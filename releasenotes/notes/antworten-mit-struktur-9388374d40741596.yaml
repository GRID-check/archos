---
features:
  - >
    Answers are easier to scan: the first line gives the value in bold,
    checks by building class appear as tables with references, procedures as
    numbered steps, and open items as a task list.
  - >
    Where a text does not show a structure well, Piloti draws its own
    diagram, such as for a branching procedure, for who hands what to whom,
    or for a construction schedule from the project documents. You can file
    the drawing in the project.
fixes:
  - >
    An answer containing a drawing or code block no longer shows up as raw text.
