---
operators:
  - >
    Traces from the backend now carry the service names backend-chat and
    backend-api instead of grid-aiq-agent and grid-aiq-api, so re-point any
    saved trace view or alert that filters on the old names. The span
    attributes move from aiq.* to app.* (app.user.id, app.auth.type,
    app.caller.type, app.access.channel, app.client.id and their siblings);
    for one release they are also written under aiq.*, so views on the old
    names keep matching until you move them. The mode header is now
    X-Chat-Mode and the access-channel header X-Access-Channel; the old
    X-AIQ-* headers are still read for one release.
