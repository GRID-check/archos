---
fixes:
  - >
    Diagrams in an answer are drawn again instead of appearing as a block of
    code, including diagrams whose labels are in quotation marks, which used
    to break completely.
  - >
    An answer with a diagram is no longer marked as low confidence because
    of it. The words inside a diagram were being checked as quotations from
    a source, so a well-supported answer lost its rating just for containing
    a picture.
