---
features:
  - >
    Ask Piloti to do office work in plain German, such as creating a folder or renaming a document,
    and it proposes the change for you to accept and closes with a short report of what waits for you, what is
    blocked and what comes next.
improvements:
  - >
    Piloti now knows which of its proposals in a chat are still waiting, applied or failed, so it no longer
    proposes the same change twice or reports a failed change as done.
