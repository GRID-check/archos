---
features:
  - >
    A deep research report now opens with the verdict, summary and key points,
    followed by a findings matrix with one row per requirement checked: its
    value, reference and status. The Word file contains the same table.
  - >
    While research runs, its block shows the evidence gathered so far in each
    round. Jetzt schreiben ends the research after the current round and
    writes the report from what has been found.
fixes:
  - >
    A report in German now ends with Quellen instead of Sources, and the note
    on a report that was cut short follows the report's language.
