---
features:
  - >
    Whole folders can now be uploaded, with Ordner hochladen or by dragging the
    folder onto the file list, with every level beneath it. Files Piloti cannot
    read are rejected one by one, not the whole folder.
  - >
    The detail view shows where the file sat inside the folder you uploaded,
    and one click copies that path.
fixes:
  - >
    Uploads into a project or into Office filing are no longer limited to 100
    MB at a time, so a complete Einreichung goes through. Only your
    organization's storage quota applies now.
