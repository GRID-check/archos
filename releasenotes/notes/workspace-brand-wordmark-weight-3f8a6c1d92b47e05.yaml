---
improvements:
  - >
    The workspace now wears the corporate design consistently: the name is set
    as the brand's wordmark in the sidebar and on the error
    pages, titles and labels use one calm weight instead of bold, cards and
    menus take the warm paper tone instead of pure white, and exported PDFs
    carry the wordmark and the brand's black, warm white and grey.
  - >
    Secondary text and status chips are darker where they were too faint to
    read comfortably, in the light and the dark theme, and the file preview
    can be scrolled with the keyboard.
