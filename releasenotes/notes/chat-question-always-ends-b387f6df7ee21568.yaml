---
fixes:
  - >
    A question in the chat no longer keeps showing „Denkt nach“ when no
    answer comes. It ends with an error that you can retry.
  - >
    The first question in a new chat is no longer lost when you send it
    straight from a suggestion, without typing.
  - >
    If you stop a question before Piloti starts on it, it is no longer sent
    again when the connection comes back.
  - >
    When Piloti was updated while your page was open, it now asks you to
    reload instead of asking you to check your network.
operators:
  - >
    The chat socket's first frame is now a hello carrying the deployed commit,
    and the page sends nothing until it arrives. Roll the agent out before the
    web tier, or together with it: a page from this release treats an agent
    without the hello as incompatible and shows that instead of answering.
