---
features:
  - >
    Folders in a project's files can now be renamed, moved and deleted, not
    only created. Hover over a folder in the tree to open its menu: Rename
    lets you edit the name in place, and Delete asks once before removing
    the folder.
  - >
    Deleting a folder moved its documents and subfolders into the folder above
    first, and the confirmation said where they went, for example to
    Brandschutz. A message afterwards repeated the count, and project folders
    have since gone to the bin instead.
