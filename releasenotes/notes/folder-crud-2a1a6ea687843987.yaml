---
features:
  - >
    Folders in a project's files can now be renamed, moved and deleted, not
    only created. Hover over a folder in the tree to open its menu: Rename
    lets you edit the name in place, and Delete asks once before removing
    the folder.
  - >
    Deleting a folder never deletes what is in it: its documents and
    subfolders move into the folder above first. The confirmation says where
    they go, for example to Brandschutz, and a message afterwards repeats
    the count.
