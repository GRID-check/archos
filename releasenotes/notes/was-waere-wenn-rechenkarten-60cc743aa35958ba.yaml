---
features:
  - >
    A U-value, the Schrittmaßregel, an escape route's length or a room's glazing
    share now comes as a „Was wäre wenn“ card: change an input and the result
    and the verdict against the cited OIB limit recompute on the spot. A changed
    value is marked „Ihre Annahme“ beside the source's figure, „Zurücksetzen“
    restores the source, and nothing is saved.
