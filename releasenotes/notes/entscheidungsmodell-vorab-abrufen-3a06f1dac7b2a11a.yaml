---
features:
  - >
    Piloti starts reading before it starts thinking: for a question about a
    regulation or a project file, it fetches the likely passages first, so
    questions can be answered one step sooner. The derivation (Herleitung) shows
    this as the first search step.
  - >
    Piloti checks its first search results faster, and searches again with other
    wording only when they fall short.
  - >
    Follow-up questions such as „und in Gebäudeklasse 4?“ are answered from the
    passages the previous answer already read, so a follow-up takes one step
    instead of a new search.
