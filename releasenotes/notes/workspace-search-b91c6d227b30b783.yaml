---
features:
  - >
    Search finds anything the office holds, from anywhere with Ctrl+K:
    documents by their name, by what they are and by what they say, with the
    matching passage and page, plus annotations, folders, projects and
    conversations. It searches every project and the office shelf at once, or
    inside one project or folder.
  - >
    Filter documents by type, drawing number, revision, scale, parties, place,
    stated facts such as building class, cited norms, dates and status, and
    sort them like a drawing register with one row per document. Save the
    search, or export the result as a CSV or Excel drawing list that names
    each document's folder path.
  - >
    Closing a document or annotation opened from the search returns to the
    search as you left it, with its words, filters, view and sort.
