---
features:
  - >
    Search finds anything in your office from anywhere (Ctrl+K): documents by
    their name, by what they are and by what they say, with the matching page,
    plus annotations, folders, projects and conversations, across every project
    and the office shelf, or inside one project or folder.
  - >
    Filter documents by type, drawing number, revision, plan date, scale,
    parties, place, stated facts such as building class, cited norms or
    drawings, dates and status, sort them like a drawing register, save the
    search, and export the result as a plan list for Excel.
