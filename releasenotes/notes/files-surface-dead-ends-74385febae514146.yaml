---
fixes:
  - >
    A search over your files or the Archiv that failed to run, for instance
    because it timed out, used to report "no matches for …", a statement
    about your own documents that Piloti had no way of making. Now it says
    the search failed and offers to run the same query again.
improvements:
  - >
    A document whose reading failed can be read again from its own card:
    "Erneut lesen" is in the ⋯ menu, beside rename and delete, wherever the
    failure is shown. Until now the card only said it had failed, and the
    one retry was two clicks inside a viewer you had no reason to open.
