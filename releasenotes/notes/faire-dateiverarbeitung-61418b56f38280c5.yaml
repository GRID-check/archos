---
improvements:
  - >
    Your uploads no longer wait behind another office's large import.
  - >
    A file waiting to be read shows how many of your office's uploads are
    ahead of it, for example "Waiting · 3 files ahead".
fixes:
  - >
    A file that was still waiting to be read during an interruption is now
    read afterwards instead of showing as failed.
operators:
  - >
    Ingestion runs from a durable queue on its own worker tier, scaled by KEDA
    on the queue's depth; see ADR-0076 and the ingest-worker settings in the
    stack files before deploying.
