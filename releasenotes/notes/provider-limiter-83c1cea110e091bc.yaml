---
improvements:
  - >
    When the AI is at capacity, answers to your questions now go ahead of
    background work, such as a project's documents being processed again, so
    a large upload slows the chat down less.
operators:
  - >
    Model calls now pass one fleet-wide limiter that serves chat before research
    and bulk work and slows down on 429, per model or for the whole key. Tune it
    with the GRID_PROVIDER_* variables; GRID_PROVIDER_LIMITER=off disables it.
