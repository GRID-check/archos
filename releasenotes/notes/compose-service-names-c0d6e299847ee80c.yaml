---
operators:
  - >
    In Docker Compose the backend services aiq-agent and aiq-api are now chat
    and api, containers are named grid-<service>, and the network is
    grid-network. Update with docker compose up -d --remove-orphans, or the old
    containers keep their ports, and change BACKEND_URL or BACKEND_CHAT_URL in
    your .env if you set them to the old names.
