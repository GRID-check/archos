---
operators:
  - >
    In Docker Compose the backend services aiq-agent and aiq-api are now chat
    and api, grid-migrate, grid-audit-schemas and grid-workos-authz are migrate,
    audit-schemas and workos-authz, and the network is app. Containers take
    Compose's default names. Update with docker compose up -d --remove-orphans,
    or the old containers keep their ports.
