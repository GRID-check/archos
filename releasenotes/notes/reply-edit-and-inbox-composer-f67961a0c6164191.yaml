---
features:
  - >
    You can now edit or delete your own reply in an Anmerkung's thread while
    the Anmerkung is open and Piloti has not answered it yet. An edited reply is
    marked as edited, and colleagues it no longer mentions stop seeing it in
    their Postfach.
improvements:
  - >
    Answering an Anmerkung from the Postfach now works like the thread: Enter
    sends, „@“ mentions a colleague, and @Piloti asks Piloti where your office
    lets Piloti answer in threads.
