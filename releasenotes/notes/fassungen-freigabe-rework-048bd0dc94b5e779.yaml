---
features:
  - >
    Sending a document for review now asks for a reviewer and a one-sentence
    instruction, and approving takes an explicit confirmation that names the
    version and the date.
  - >
    Review requests can now be decided in the inbox: approve, ask for
    changes or reject. Each row shows the instruction, the deadline and a
    link to the file.
improvements:
  - >
    Document cards and lists lead with the title and the review state
    instead of version counters, and a version history only appears once a
    second version exists.
  - >
    Approving and publishing are two clearly separate steps, so you can tell
    at a glance which one has happened.
