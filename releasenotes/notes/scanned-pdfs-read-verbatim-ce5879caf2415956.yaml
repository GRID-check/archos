---
fixes:
  - >
    A scanned PDF is now read word for word, up to 500 pages, tables included,
    and the file says how many pages were not read. Before, only its first 20
    pages were looked at and those were described rather than read, so the
    conditions in a scanned permit could not be found.
  - >
    Some PDFs, exported by certain drawing programs or scanners, contain text
    that comes out as gibberish. Piloti now reads such a PDF as page images,
    and the gibberish no longer ends up in search.
  - >
    A scanned PDF that cannot be read now gives the reason instead of a
    generic message.
