---
features:
  - >
    Follow-up questions now appear under answers that can take them, instead of
    only on the answers Piloti happened to offer them on. They appear once the
    answer has finished and sit below it rather than inside it, so they do not
    move the text you are reading.
upgrade:
  - >
    Follow-up questions in older chats stay where they were, inside the answer.
    Only the position of new follow-up questions has changed.
  - >
    A finished deep-research report no longer carries follow-up questions. They
    are offered on chat answers instead, since a report is written after the
    chat answer is complete.
