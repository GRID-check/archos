---
features:
  - >
    Follow-up questions now appear under every substantive answer, instead of
    only on the answers Piloti happened to offer them on. They arrive a moment
    after the answer and sit below it rather than inside it, so they never move
    the text you are reading.
upgrade:
  - >
    Follow-up questions in older conversations stay exactly where they were,
    inside the answer. Nothing was regenerated or removed: only the position
    of new follow-up questions has changed, so older conversations keep
    theirs.
  - >
    A finished deep-research report no longer carries follow-up questions.
    They are offered on chat answers instead, since a report is written after
    the chat turn has already ended.
