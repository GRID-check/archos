---
features:
  - >
    A document Piloti wrote only becomes searchable once someone in your
    office has approved and published it. Drafts, documents in review and
    rejected ones stay out of search.
improvements:
  - >
    An archived document no longer turns up as a source in answers, whoever
    wrote it. The file and its versions stay where they were; archiving is not
    deleting.
  - >
    Once a newer version is published, Piloti stops answering from the
    replaced one. The older version stays in the version list and can still
    be opened.
fixes:
  - >
    A document Piloti wrote can no longer take the file name of a document
    someone uploaded, such as the one it was written from.
