---
operators:
  - >
    Retrieval can now run on Qdrant instead of Chroma, switched per deployment
    with the vector backend setting: dual copies every new document into both
    stores, qdrant answers searches from Qdrant. Nothing changes until the
    setting is flipped; existing documents are copied over by the Qdrant
    backfill without being read or embedded again.
  - >
    With Qdrant answering, a search across an office's other projects ranks up
    to 40 projects in one query instead of 8, ordered by one ranking rather
    than by scores from separate searches.
