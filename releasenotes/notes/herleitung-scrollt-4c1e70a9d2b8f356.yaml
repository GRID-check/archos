---
fixes:
  - >
    On a phone, the Herleitung under an answer used to swallow every swipe:
    a finger anywhere on it moved nothing, so you could not scroll past it
    to the answer itself. It now scrolls like the rest of the page.
  - >
    Card headers with buttons in them no longer run past the edge of a narrow
    screen. Where there is not room for the title and the buttons on one line,
    the buttons move underneath.
improvements:
  - >
    When the on-screen keyboard opens, the app now makes room for it instead of
    letting it cover the composer, so you can see what you are typing.
