---
# One entry per user-visible change. This text is PUBLISHED, in English and in
# German machine translation, to https://piloti.at/changelog — write it for the
# architect using Piloti, not for the reviewer of your diff.
features:
  - >
    The Automation section of a project has a new Tasks tab. It lists the work
    you have handed to Piloti, whether from a chat, a review decision or a
    schedule, with what was asked, how far it got, how it was judged, and a link
    to the document or chat where the result ended up.
improvements:
  - >
    Archiving a file now takes it out of the file list, which is what archiving
    was always meant to mean. A new filter shows the archived files again
    whenever you want them back; nothing is deleted either way.
  - >
    When a draft is submitted for approval, you can now name who should look at
    it. Leave it as it is and everyone who may release files in the project is
    asked, so a draft nobody has taken on still reaches somebody.
fixes:
  - >
    Uploading a corrected version of a file that is already in a project works
    again. The upload was refused while the previous version was still the
    published one.
  - >
    Whoever commissioned a report can now release it. Piloti files a report
    under the name of the person who asked for it, and that person was treated
    as its author and so could not release it.
  - >
    A document Piloti revises keeps the line that says it was written with
    Piloti. Only the first draft carried it; every later version arrived without
    it.
  - >
    Older and unpublished versions of a file now count towards the storage your
    office uses. They were kept but not counted, so the storage figure was lower
    than what was really in use.
