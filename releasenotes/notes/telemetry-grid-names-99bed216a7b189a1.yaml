---
operators:
  - >
    Traces from the backend now carry the service names chat and api instead
    of grid-aiq-agent and grid-aiq-api, so re-point any saved trace view or
    alert that filters on the old names. The span attributes lose their aiq.
    prefix (user.id, user.email, auth.type, auth.transport, caller.type,
    access.channel, client.id and their siblings); for one release they are
    also written under aiq.*, so views on the old names keep matching until
    you move them. The mode header is now X-Chat-Mode and the access-channel
    header X-Access-Channel; the old X-AIQ-* headers are still read for one
    release.
