---
fixes:
  - >
    A file whose reading was cut short by a restart now shows as failed,
    with a retry, instead of staying in progress forever and being
    impossible to read again. A restart while a Word or PowerPoint file is
    still being converted is not covered: that file stays at „Wird gelesen“
    until you choose „Erneut lesen“.
  - >
    A PDF with a few damaged pages is now read up to its last page instead
    of stopping at the first damaged one. A PDF with too many damaged pages
    fails with a retry instead of being read with gaps.
