---
fixes:
  - >
    A file whose reading was cut short by an interruption now shows as failed,
    with a retry, instead of staying in progress and being impossible to read
    again.
  - >
    A PDF with a few damaged pages is now read up to its last page instead
    of stopping at the first damaged one. A PDF with too many damaged pages
    fails with a retry instead of being read with gaps.
