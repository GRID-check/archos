---
improvements:
  - >
    A deleted document, or one you can no longer open, now says so in the
    preview instead of offering a retry that cannot work. One click stops the
    question about it.
  - >
    Asking Piloti about a file from Dateien no longer blinks: the file stays on
    screen while the chat loads beside it.
  - >
    Closing the preview is never one-way: with the ✕, Escape or by dragging it
    shut, a tab stays at the edge and brings the document back at the width you
    chose.
  - >
    The file preview beside a chat now says when Piloti cannot use a document
    yet: a file still being prepared, or one whose preparation failed, carries
    that note under its name instead of looking ready. The note clears itself
    once preparation finishes, and a failure links to the detail view.
  - >
    The preview now shows the summary Piloti made of the document, under the
    document itself. A file without an inline preview offers its download
    instead.
