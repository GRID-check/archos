---
features:
  - >
    Deep research no longer has a side panel: each run is a block in the chat
    that started it, with its status, findings per round, Jetzt schreiben,
    Abbrechen and finally the report.
  - >
    The chat stays open during and after a deep research, so you can keep asking
    beside the run, and Bericht fortschreiben runs in the same chat.
fixes:
  - >
    A research run whose end your browser missed no longer locks the chat, and a
    running research never blocks typing, renaming or deleting.
