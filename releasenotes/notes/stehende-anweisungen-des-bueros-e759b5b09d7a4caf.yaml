---
features:
  - >
    Your organization can now give Piloti standing instructions under
    Organisation, Anweisungen, such as result first, then reasons, or assume
    Vienna when no province is named. They apply to every question from everyone
    in the office.
  - >
    Standing instructions can shape only the form and focus of answers, up to
    1,500 characters, and never supply a value the building law sets. An OIB
    requirement always comes from the Richtlinie Piloti opened, and each change
    is saved with its name and time.
