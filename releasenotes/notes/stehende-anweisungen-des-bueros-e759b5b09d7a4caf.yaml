---
features:
  - >
    Your organization can now give Piloti standing instructions under
    Organization → Instructions, such as result first, then reasons, or assume
    Vienna when no province is named. They apply to every question from everyone
    in the office.
  - >
    Standing instructions shape only the form and focus of answers, up to 1,500
    characters, and do not change what the building law requires. Each change is
    saved with its name and time.
