---
fixes:
  - >
    A diagram filed into a project now records in the file itself that Piloti
    drew it. A drawing that leaves the office can no longer pass for one a
    person drew.
upgrade:
  - >
    Nothing Piloti writes can be filed without that mark any more: a file that
    does not say who wrote it is refused. Files already in a project stay as
    they are; file a drawing again to get a marked copy.
