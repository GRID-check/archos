---
fixes:
  - >
    Uploading a file again under the same name now keeps the earlier version as
    a numbered version.
  - >
    When two people, or Piloti and a person, save the same draft at once, one
    change is kept and the other is told the draft has changed. Before, the
    second change could silently overwrite the first.
  - >
    When two people press “Publish” at the same time, the second one is told the
    version is already published, rather than seeing an error.
  - >
    Each new version now counts towards your storage, because earlier versions
    are kept. Before, repeated versions could exceed the storage limit without
    anyone noticing.
  - >
    Deleting a document with more than 500 versions now removes all of its
    versions, not only the first 500 versions.
