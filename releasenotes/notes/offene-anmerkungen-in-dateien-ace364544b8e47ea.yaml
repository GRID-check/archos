---
features:
  - >
    Dateien now says which documents still have open Anmerkungen, and how many
    of them are yours, in words: „4 offen · 2 für Sie“ under the size and date
    on the card, and beside the name in the list. Pressing it opens the
    document in the Prüfansicht.
  - >
    Freigeben now names the Anmerkungen still open on the document before you
    sign, such as „4 offene Anmerkungen – trotzdem freigeben?“, with a link to
    the Prüfansicht. It does not stop the Freigabe.
fixes:
  - >
    After a new Fassung arrives, the Protokoll still lists every Anmerkung that
    is open on an earlier Fassung, and each entry says which Fassung it was
    set on. Before, the default Protokoll left them out, so a Jour fixe run
    from it missed exactly those points.
