---
fixes:
  - >
    Assigning someone to a file now says when it did not work, names the
    person and offers to try again. A refused assignment used to change
    nothing on screen, which read as success.
  - >
    The file list keeps its final layout while it loads. Before, loading and
    searching showed placeholder cards even in the detail view, so the list
    appeared only after a flash of cards that were never going to be there.
  - >
    Upload errors are now written in the language you use, as one sentence:
    too large, wrong type, already added, or no room left. A rejected file
    used to put an English clause into a German message.
