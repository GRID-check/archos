---
operators:
  - >
    Qdrant's web dashboard opens in the browser at qdrant.<baseDomain>, behind
    the same WorkOS sign-in as Langfuse and for platform operators only. It is
    on wherever that sign-in is configured, so add its callback to the WorkOS
    application first. The Qdrant runbook lists the secrets to set, the
    callback, and which key to paste.
