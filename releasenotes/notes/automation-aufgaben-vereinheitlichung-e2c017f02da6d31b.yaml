---
features:
  - >
    Automations now sit in one Aufgaben list: one-off tasks you hand to
    Piloti and scheduled templates share the same rows, with the rhythm and
    the next run shown inline, and every run opens in a detail view with its
    result.
improvements:
  - >
    Task statuses stay live while the panel is open and use plain planning
    language, so finished work no longer looks like it is still running.
fixes:
  - >
    Technical status words no longer appear on task rows, and scheduled
    results link back to their task instead of getting lost in the chat
    history.
