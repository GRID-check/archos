features:
  - >
    Your own AI assistant, such as Claude, ChatGPT or Cursor, can now work in
    Piloti for you with your rights, set up from Connect your agent on your
    profile once your organization switches it on.
    It asks you before it changes or deletes anything, so you stay in charge.
