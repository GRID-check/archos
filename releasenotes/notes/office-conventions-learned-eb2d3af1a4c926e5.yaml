---
operators:
  - >
    Piloti can count an office's conventions from its own projects: the folders
    most projects keep, where each document type is filed, the drawing number
    shape, the index style and the date in file names. Questions about filing
    or finding then get these lines, stated as usual, never always. Off until
    GRID_OFFICE_CONVENTIONS is set to on; migration 0181 adds its table.
