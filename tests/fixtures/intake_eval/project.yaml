        Übermittelt an die Planverfasserin des Nachbarprojekts Hubergasse 14 zur Abstimmung der Feuermauer.

        1. Gebäudebeschreibung
        Das Gebäude Hubergasse 16 umfasst fünf oberirdische Geschoße (Erdgeschoß, 1. bis 3. Obergeschoß und
        ausgebautes Dachgeschoß) sowie ein Kellergeschoß. Es enthält 14 Wohnungen. Die Brutto-Grundfläche der
        oberirdischen Geschoße beträgt 1.890,00 m².
      - |
        2. Einstufung
        Das Fluchtniveau beträgt 13,80 m. Das Gebäude ist der Gebäudeklasse 5 zuzuordnen.

        3. Anlagentechnischer Brandschutz
        Im Stiegenhaus ist eine Brandmeldeanlage (BMA) mit Rauchansaugsystem installiert, die die
        Rauchabzugseinrichtung ansteuert.

        4. Feuermauer zur Liegenschaft Hubergasse 14
        Die Feuermauer zur Liegenschaft Hubergasse 14 ist in REI 90 ausgeführt. Bei einer Aufstockung des
        Nachbargebäudes ist die Feuermauer in gleicher Qualität fortzuführen.

