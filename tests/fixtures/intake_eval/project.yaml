        Wien, 28. April 2026

        BESCHEID

        Hubergasse 14 Projektentwicklungs GmbH als Bauwerberin; Liegenschaft 1160 Wien, Hubergasse 14,
        EZ 1234 der KG Ottakring

        Spruch
        Nach Maßgabe der mit dem amtlichen Sichtvermerk versehenen Pläne (Einreichpläne EP-01 und EP-02, Index B
        vom 03.02.2026) wird gemäß § 70 der Bauordnung für Wien die Bewilligung erteilt, auf der oben genannten
        Liegenschaft folgende Bauführung vorzunehmen:
        Das bestehende Wohngebäude wird durch die Errichtung eines weiteren Geschoßes (3. Obergeschoß) in
        Holzmassivbauweise aufgestockt. Im 3. Obergeschoß werden vier Wohnungen geschaffen. Im Stiegenhaus wird
        ein Personenaufzug eingebaut.
      - |
        Vorschreibungen
        1. Die Feuermauern zu den Nachbarliegenschaften sind in der Aufstockung in der Feuerwiderstandsklasse
           REI 90 auszuführen.
        2. Die Rauchabzugseinrichtung im Stiegenhaus ist vor Fertigstellung durch einen Sachverständigen
           abnehmen zu lassen.
        3. Der Beginn der Bauführung ist der Behörde drei Tage vorher anzuzeigen.

        Begründung
        Das Vorhaben entspricht den Bebauungsbestimmungen des Plandokuments 8125. Einwendungen der Nachbarn
        wurden in der Bauverhandlung vom 10.03.2026 nicht erhoben.

        Rechtsmittelbelehrung
        Gegen diesen Bescheid kann innerhalb von vier Wochen nach Zustellung Beschwerde an das
        Verwaltungsgericht Wien erhoben werden.

        Für den Abteilungsleiter: Ing. Huber

