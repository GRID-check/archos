# The intake eval's fixture project (scripts/intake_eval, `task be:eval:intake`).
#
# An Aufstockung of a Gründerzeit-Wohnhaus in Wien-Ottakring, as the folder an
# office would drop on the setup page: ten documents, each as the reading
# tools return it, page by page. Every name, number and party is invented.
# What each document states for the project, and the traps planted in them,
# is in answer_key.yaml beside this file; change both together.
#
# `folder`, `added_at` and `revision_facts` are what list_files shows (the
# title-block facts production reads off a drawing's first page). No file is
# marked as superseded: the folder was dropped in one go, so the two Fassungen
# of EP-01 arrive as two documents, which is the case the agent must judge.

