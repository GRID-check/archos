[build-system]
build-backend = "setuptools.build_meta"
requires = ["setuptools>=83.0.0", "setuptools-scm>=8"]

[tool.setuptools]
packages = ["oib_compliance"]
package-dir = {"oib_compliance" = "src/oib_compliance"}

[project]
name = "oib-compliance"
version = "1.0.0"
description = "Golden OIB-compliance eval suite for NAT - deterministic checklist + latency/cost bounds evaluator"
readme = "README.md"
requires-python = ">=3.14,<3.15"
license = {text = "Apache-2.0"}
dependencies = [
    "nvidia-nat-eval==1.9.0",
    "pydantic>=2.0.0",
]

[project.entry-points."nat.plugins"]
oib_compliance = "oib_compliance.register"
