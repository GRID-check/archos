# Grid agent — single source of truth for "how do I run this?"
#
# Why this file exists
# -------------------
# The same commands were previously written down in three places that drifted
# independently: `.github/workflows/ci.yml`, the verification table in
# AGENTS.md, and the `ci:*` scripts in `frontends/ui/package.json` (which
# pointed at a `scripts/ci-check.sh` that did not exist). Documented commands
# also assumed a Windows venv layout (`.venv/Scripts/python.exe`) and so did not
# run in CI, the devcontainer, or an agent session.
#
# Everything below is defined once and consumed by humans, agents and CI alike.
# `task verify` IS the merge gate — if it passes locally it passes in CI, and if
# it drifts, it drifts for everyone at once instead of silently for one of them.
#
# Layout:   this file holds the shared vars/env and the cross-tier gates
#           (verify, verify:fast, setup). Each tier's tasks live in
#           taskfiles/<tier>.yml, included flat so task names are unchanged;
#           CI's paths filters watch the tier's own file, not this one.
#
# Install:  npm i -g @go-task/cli   (or see https://taskfile.dev/installation/)
# Discover: task --list

version: '3'

vars:
  UI: frontends/ui
  # Agent Package Manager CLI, pinned so every machine and CI resolve the same
  # skill bytes. Bump deliberately and re-run `task agents:audit`.
  APM_VERSION: 0.28.0
  WEB: frontends/web
  # go-task ships its own POSIX shell, so command SYNTAX is already portable and
  # nothing below needs an OS branch. These two are the exception, because they
  # are Python packaging facts rather than shell facts: a virtualenv puts its
  # executables in `Scripts/` on Windows and `bin/` everywhere else. Stated once
  # here so no task has to know about it.
  VENV_BIN: '{{if eq OS "windows"}}.venv/Scripts{{else}}.venv/bin{{end}}'
  EXE: '{{if eq OS "windows"}}.exe{{end}}'
  PY: '{{.VENV_BIN}}/python{{.EXE}}'
  RUFF: '{{.VENV_BIN}}/ruff{{.EXE}}'
  # pytest-xdist, one worker per logical CPU, for the core and aiq_api suites.
  # Much of their wall clock is asyncio waits, so a serial run left the runner
  # idle: on two workers aiq_api went 67s -> 44s, the core suite ~3m20s -> 2m27s.
  # A test that only passes after another one ran will fail under it; fix the
  # test, do not drop the flag.
  XDIST: -n logical
  # The pre-commit hooks `verify` skips, because a tier it runs checks the same.
  VERIFY_SKIP: ruff-check,ruff-format,english-names
  # Release-note tooling runs OUTSIDE the project environment on purpose. reno is
  # needed by two tasks and one workflow, never by the product, so putting it in
  # `[dependency-groups]` would add a resolver constraint (and uv.lock churn) to
  # every backend install for tooling none of them uses. `--no-project` builds a
  # throwaway env from uv's cache instead — offline after the first run.
  RENO: uv run --no-project --with reno==4.1.0 reno --rel-notes-dir releasenotes
  RELNOTES: uv run --no-project --with reno==4.1.0 python scripts/release_notes.py

env:
  # The documented footgun, removed. Without this pytest resolves `aiq_agent`
  # from whatever is installed in the venv rather than from this worktree, and
  # validates the wrong code while appearing to pass.
  PYTHONPATH: src

includes:
  # flatten: task names stay literal (`fe:test`, not `frontend:fe:test`). dir: .
  # keeps every task's working directory what it was in the single file.
  # Each tier's file is what CI's paths filters (.github/filters.yml) watch.
  repo:
    taskfile: taskfiles/repo.yml
    flatten: true
    dir: .
  backend:
    taskfile: taskfiles/backend.yml
    flatten: true
    dir: .
  frontend:
    taskfile: taskfiles/frontend.yml
    flatten: true
    dir: .
  web:
    taskfile: taskfiles/web.yml
    flatten: true
    dir: .
  infra:
    taskfile: taskfiles/infra.yml
    flatten: true
    dir: .
  packages:
    taskfile: taskfiles/packages.yml
    flatten: true
    dir: .

tasks:
  default:
    desc: List available tasks
    silent: true
    cmds:
      - task --list

  # ── the gate ────────────────────────────────────────────────────────────────

  verify:
    desc: 'Full merge gate: everything CI runs. Passing here means passing in CI.'
    cmds:
      # Delegate to the same per-tier task groups CI invokes, so there is one
      # definition of each tier's gate rather than a second list here that can
      # drift from the workflow (that drift is exactly what this file removes).
      #
      # `pkg:test` is deliberately NOT here, and the number is the reason:
      # packages/ifc-spatial-py is 636 tests in 1m40s on four workers (measured 2026-10-22)
      # against its own uv.lock and its own IfcOpenShell/shapely toolchain, on a
      # directory most changes never touch. CI runs it behind a `packages/**`
      # paths filter (ci.yml's `packages` job), which pays that cost only on the
      # commits that earn it; making every local `task verify` pay it would be
      # the fastest way to get people to stop running `task verify`. Run
      # `task pkg:test` when you change `packages/`, the same discipline
      # `db:test:rls` asks for at the tenant boundary.
      #
      # lint:repo first and alone: its card and wire-schema hooks rewrite
      # generated files the type checks and the suites then read. After it the
      # tiers share nothing and run side by side, each tier's output printed
      # whole when it finishes. Ruff and the English-names test are skipped in
      # the hooks because be:verify runs both (be:lint, the core suite).
      - 'SKIP={{.VERIFY_SKIP}} {{.TASK_EXE}} lint:repo'
      - '{{.TASK_EXE}} --parallel --output=group be:verify verify:fe verify:web infra:types infra:test'

  verify:fast:
    desc: Everything CI runs except the production builds (the slow step)
    cmds:
      - 'SKIP={{.VERIFY_SKIP}} {{.TASK_EXE}} lint:repo'
      - '{{.TASK_EXE}} --parallel --output=group be:verify verify:fe:fast verify:web:fast infra:types infra:test'

  # The tiers as `verify` runs them, once lint:repo has checked the generated
  # card schemas (its card-schemas hook), so that check does not run twice.
  verify:fe:
    cmds:
      - task: verify:fe:fast
      - task: fe:build

  verify:fe:fast:
    cmds:
      - task: fe:lint
      - task: fe:types
      # Without coverage: CI's coverage is a comment, not a gate, and the
      # instrumentation only slows the suite down.
      - task: fe:test

  verify:web:
    cmds:
      - task: verify:web:fast
      - task: web:build

  verify:web:fast:
    cmds:
      - task: web:install
      - task: web:check

  setup:
    desc: Install every toolchain this repo needs (backend venv + UI + web + infra)
    env:
      # Same reason as .github/actions/setup-python-env: nltk pathsec refuses
      # hard-linked corpora, and SentenceSplitter (production + retrieval gate)
      # opens them. Copy mode is the install, not a per-job workaround.
      UV_LINK_MODE: copy
    cmds:
      - uv venv .venv
      - uv sync --group dev
      - task: fe:install
      - task: web:install
      - task: infra:install
      # packages/ used to be skipped here too, so `task pkg:test` on a fresh
      # clone failed at "vitest: not found" rather than at an assertion.
      - task: pkg:install
      - task: agents:setup
